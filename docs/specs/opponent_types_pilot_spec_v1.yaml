world: null
title: 'Opponent Types: Same Spot, Different Read'
stage: YAML spec for content review (B146b; catalog placement pending)
format: 6-max cash Hold’em study fixtures, 0.5/1 BB blinds, no ante or rake
source_anchors:
- B146b · VI-37 (0.184), opponent type lesson brief
- l0-audit/specs/w25_spec.yaml
- l0-audit/specs/codex_batch_w25_w36_brief.md and codex_batch_w14_w24_brief.md
- l0-audit/reasoning/design_note_decision_reasoning_v3.md §§1–3 and §9
proposed_principles:
- id: value_vs_frequent_caller
  introduced_in: opponent_types_pilot
  definition: Value bet when enough worse hands tend to call; check or choose a smaller size when the continuing range
    makes that better.
- id: respect_rare_raise
  introduced_in: opponent_types_pilot
  definition: A rare raise may be value-heavy; compare the modeled winning share with the actual call price rather
    than assuming every raise is strong.
model_contract:
  ranges: Equally weighted legal combinations within the explicitly stated study range. Rank labels include all suits
    unless specified; remove known cards. The simplified response groups model tendencies, not guaranteed actions
    or universal frequencies.
  enumeration: Compare best five-card hands at river showdown, enumerate legal combinations and paid chips by seat.
    Tie equity counts half heads-up. No future cards or wagers are modeled.
  payout: Incremental chip EV from the decision. Check ends the hand, opponent folds award the current pot to Hero,
    and calls include matched amounts only. Past contributions are sunk.
  grades: One correct answer per task. Main-route actions within 5% of the current pot are acceptable; Clearly worse
    reasonable options are suboptimal; large decision errors may be wrong. No Day 7 tasks in this pilot.
  pairing: Consecutive tasks with the same pNN id prefix share cards, stacks, action history, pot, call price and
    choices. Only the stated tendency and its range/response model change, with derived reasoning and grades.
lessons:
- id: opponent_types_pilot
  principle_id: value_vs_frequent_caller
  sequence:
  - guided
  - guided
  - independent
  - independent
  - independent
  - independent
  - guided
  - guided
  - independent
  - independent
  - independent
  - independent
