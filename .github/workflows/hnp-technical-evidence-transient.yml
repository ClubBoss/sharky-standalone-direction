name: HNP technical evidence transient

on:
  push:
    branches:
      - hnp/technical-revalidation-v1

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Assert exact candidate and install dependencies
        run: |
          set -euo pipefail
          mkdir -p output
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "HNP_CANDIDATE_SHA=$GITHUB_SHA" | tee output/candidate.txt
          flutter pub get
          xcodebuild -version | tee output/xcode_version.txt
          flutter --version | tee output/flutter_version.txt

      - name: Emit canonical Profile B snapshot
        run: |
          set -euo pipefail
          cat > test/_tmp_hnp_profile_b_snapshot_v1_test.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:poker_analyzer/ui_v2/act0_shell/act0_shell_state_v1.dart';

          void main() {
            test('emit production-equivalent Profile B snapshot', () {
              final fixture = jsonDecode(
                File('tools/contracts/alpha_action_capability_prerequisite_progression_v1.json')
                    .readAsStringSync(),
              ) as Map<String, dynamic>;
              expect(fixture['schema'], 'act0_progression_fixture_v1');
              final lessonIds = (fixture['completed_lesson_ids'] as List<dynamic>)
                  .map((value) => value.toString())
                  .toList(growable: false);
              final state = Act0ShellStateV1.sample;
              final world = state.worldById(fixture['world_id'] as String);
              final completedTaskIds = <String>[
                for (final lessonId in lessonIds)
                  ...world.lessons
                      .firstWhere((lesson) => lesson.lessonId == lessonId)
                      .taskList
                      .map((task) => task.taskId),
              ];
              expect(completedTaskIds, hasLength(28));
              final target = fixture['target'] as Map<String, dynamic>;
              final snapshot = <String, Object>{
                'schemaVersion': 16,
                'completedTaskIds': completedTaskIds,
                'skippedTaskIds': <String>[],
                'completedLessonIds': lessonIds,
                'selectedWorldId': world.worldId,
                'selectedLessonId': target['lesson_id'] as String,
                'selectedTaskId': target['task_id'] as String,
                'earnedXp': 0,
              };
              File('output/hnp_profile_b_progress_v1.json')
                  .writeAsStringSync(jsonEncode(snapshot));
            });
          }
          DART
          flutter test test/_tmp_hnp_profile_b_snapshot_v1_test.dart
          rm test/_tmp_hnp_profile_b_snapshot_v1_test.dart
          python3 - <<'PY'
          import json
          p=json.load(open('output/hnp_profile_b_progress_v1.json'))
          assert p['schemaVersion']==16
          assert len(p['completedTaskIds'])==28
          assert p['completedLessonIds']==[
              'what_poker_is','what_poker_is_content','cards_ranks_suits','your_first_hand']
          assert p['selectedWorldId']=='world_1'
          assert p['selectedLessonId']=='fold_check_call_raise'
          assert p['selectedTaskId']=='actions_theory'
          print('HNP_PROFILE_B_SNAPSHOT=PASS tasks=28 target=fold_check_call_raise/actions_theory')
          PY

      - name: Build exact-candidate HNP Runner
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug --dart-define=HNP_TELEMETRY=true
          APP=build/ios/iphonesimulator/Runner.app
          test -d "$APP"
          shasum -a 256 "$APP/Runner" | tee output/runner_sha256.txt

      - name: Select and open Simulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, shlex, subprocess
          payload=json.loads(subprocess.check_output(
              ['xcrun','simctl','list','devices','available','-j'], text=True))
          prefs=('iPhone 17 Pro','iPhone 16 Pro','iPhone 17','iPhone 16','iPhone 15 Pro','iPhone 15')
          candidates=[]
          for runtime, devices in payload['devices'].items():
            for d in devices:
              if not d.get('isAvailable'):
                continue
              matching=[name for name in prefs if d['name'].startswith(name)]
              if matching:
                candidates.append((prefs.index(matching[0]), runtime, d))
          if not candidates:
            raise SystemExit('no suitable iPhone Simulator')
          _, runtime, d=sorted(candidates, key=lambda x:(x[0], x[1]))[0]
          open('output/simulator_selection.env','w').write('UDID='+shlex.quote(d['udid'])+'\n')
          open('output/simulator_identity.txt','w').write(
              'SIM_NAME='+d['name']+'\nSIM_RUNTIME='+runtime+'\nSIM_UDID='+d['udid']+'\n')
          PY
          source output/simulator_selection.env
          cat output/simulator_identity.txt
          xcrun simctl shutdown all 2>/dev/null || true
          xcrun simctl boot "$UDID"
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b

      - name: Profile A clean-install native launch
        run: |
          set -euo pipefail
          source output/simulator_selection.env
          BUNDLE_ID=com.example.pokerAnalyzer
          APP=build/ios/iphonesimulator/Runner.app
          xcrun simctl uninstall "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch \
            --terminate-running-process \
            --stdout="$PWD/output/profile_a.stdout.log" \
            --stderr="$PWD/output/profile_a.stderr.log" \
            "$UDID" "$BUNDLE_ID" | tee output/profile_a.launch.txt
          sleep 6
          xcrun simctl io "$UDID" screenshot output/profile_a.png >/dev/null
          test -s output/profile_a.png
          DATA_CONTAINER="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
          echo "$DATA_CONTAINER" > output/profile_a.container.txt
          TRACE="$DATA_CONTAINER/Library/Application Support/act0_hnp_trace_v1.jsonl"
          test -e "$TRACE"
          cp "$TRACE" output/profile_a.initial_trace.jsonl
          test ! -s output/profile_a.initial_trace.jsonl
          xcrun simctl terminate "$UDID" "$BUNDLE_ID"
          echo "HNP_PROFILE_A_NATIVE_LAUNCH=PASS"

      - name: Materialize Profile B through production UserDefaults contract
        run: |
          set -euo pipefail
          source output/simulator_selection.env
          BUNDLE_ID=com.example.pokerAnalyzer
          PROGRESS="$(cat output/hnp_profile_b_progress_v1.json)"
          # shared_preferences_foundation stores legacy SharedPreferences values
          # in the application domain under the flutter. prefix.
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" flutter.intake_completed_v1 -bool true
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" flutter.act0_welcome_completed_v1 -bool true
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" flutter.act0_shell_progress_v1 -string "$PROGRESS"
          xcrun simctl spawn "$UDID" defaults read "$BUNDLE_ID" flutter.act0_shell_progress_v1 > output/profile_b.progress.before.json
          python3 - <<'PY'
          import json
          p=json.loads(open('output/profile_b.progress.before.json').read().strip())
          assert len(p['completedTaskIds'])==28
          assert p['selectedLessonId']=='fold_check_call_raise'
          assert p['selectedTaskId']=='actions_theory'
          print('HNP_PROFILE_B_PERSISTENCE_WRITE=PASS')
          PY

      - name: Profile B normal bootstrap preservation
        run: |
          set -euo pipefail
          source output/simulator_selection.env
          BUNDLE_ID=com.example.pokerAnalyzer
          xcrun simctl launch \
            --terminate-running-process \
            --stdout="$PWD/output/profile_b.stdout.log" \
            --stderr="$PWD/output/profile_b.stderr.log" \
            "$UDID" "$BUNDLE_ID" | tee output/profile_b.launch.txt
          sleep 8
          xcrun simctl io "$UDID" screenshot output/profile_b.png >/dev/null
          test -s output/profile_b.png
          DATA_CONTAINER="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
          echo "$DATA_CONTAINER" > output/profile_b.container.txt
          TRACE="$DATA_CONTAINER/Library/Application Support/act0_hnp_trace_v1.jsonl"
          test -e "$TRACE"
          cp "$TRACE" output/profile_b.initial_trace.jsonl
          xcrun simctl terminate "$UDID" "$BUNDLE_ID"
          xcrun simctl spawn "$UDID" defaults read "$BUNDLE_ID" flutter.act0_shell_progress_v1 > output/profile_b.progress.after.json
          python3 - <<'PY'
          import json
          p=json.loads(open('output/profile_b.progress.after.json').read().strip())
          assert p['schemaVersion']==16, p
          assert p['selectedWorldId']=='world_1', p
          assert p['selectedLessonId']=='fold_check_call_raise', p
          assert p['selectedTaskId']=='actions_theory', p
          assert p['completedLessonIds']==[
              'what_poker_is','what_poker_is_content','cards_ranks_suits','your_first_hand'], p
          assert len(p['completedTaskIds'])==28, len(p['completedTaskIds'])
          print('HNP_PROFILE_B_BOOTSTRAP_PRESERVATION=PASS schemaVersion=%s tasks=%s' %
                (p['schemaVersion'], len(p['completedTaskIds'])))
          print('HNP_PROFILE_B_NATIVE_MATERIALIZATION=PASS')
          PY

      - name: Record evidence-only disposition
        if: always()
        run: |
          {
            echo 'PRODUCT_RUNTIME_MUTATION=NONE'
            echo 'PRODUCT_REPAIR_BUDGET_CONSUMED=0'
            echo 'XCUITEST_USED=NO'
          } | tee output/disposition.txt
          git checkout -- macos/Flutter/GeneratedPluginRegistrant.swift 2>/dev/null || true
          git status --short | tee output/git_status.txt

      - name: Upload bounded technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hnp-technical-probe-${{ github.sha }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
