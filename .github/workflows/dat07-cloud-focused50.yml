name: DAT-07 formatter artifact preparation

on:
  push:
    branches: [qa/dat07-cloud-focused50-20261110]
    paths: [.github/workflows/dat07-cloud-focused50.yml]

permissions:
  contents: read
concurrency:
  group: dat07-cloud-focused50-20261110
  cancel-in-progress: false

jobs:
  dat07-format-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_SHA: 2e0eb78d6571f5855a3f99a69cce17cdec3de2cd
      PRODUCT_TREE: 80740e7ba0a137cd2a157c15536ff4994403f3a8
      BASE_SHA: 3784d421beb5ae7cb8cfaacd10b1083855148850
      PARENT_PRODUCT_SHA: e0638a64be0489c6d3481935c5e3501576ece15d
      REGISTRANT_POST_SHA256: 5642d3b51159f8c208ffb9bb1d83a08820a43c7313ee3ba411b282c2d6aec498
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: workflow
          persist-credentials: false
          sparse-checkout: .github/workflows/dat07-cloud-focused50.yml
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: 2e0eb78d6571f5855a3f99a69cce17cdec3de2cd
          fetch-depth: 4
          path: product
          persist-credentials: false
      - name: Prepare bounded evidence tools
        run: |
          mkdir -p gate evidence
          cat > gate/run_logged.py <<'GATE_EOF'
          #!/usr/bin/env python3
          """Stream one bounded CI command to its raw log and write an exit receipt."""
          import argparse
          import datetime
          import json
          import os
          from pathlib import Path
          import selectors
          import signal
          import subprocess
          import sys
          import time


          class SignalTermination(BaseException):
              def __init__(self, signum):
                  self.signum = signum
                  super().__init__(f"signal {signum}")


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--name", required=True)
              parser.add_argument("--log", required=True)
              parser.add_argument("--receipt", required=True)
              parser.add_argument("--follow-log")
              parser.add_argument("--timeout-seconds", required=True, type=float)
              parser.add_argument("--heartbeat-seconds", default=60, type=float)
              parser.add_argument("command", nargs=argparse.REMAINDER)
              args = parser.parse_args()
              command = args.command[1:] if args.command[:1] == ["--"] else args.command
              if not command or args.timeout_seconds <= 0 or args.heartbeat_seconds <= 0:
                  parser.error("command and positive timeout/heartbeat values are required")
              log_path, receipt_path = Path(args.log), Path(args.receipt)
              log_path.parent.mkdir(parents=True, exist_ok=True)
              receipt_path.parent.mkdir(parents=True, exist_ok=True)
              started_at = datetime.datetime.now(datetime.timezone.utc).isoformat()
              started = time.monotonic()
              deadline = started + args.timeout_seconds
              next_heartbeat = started + args.heartbeat_seconds
              last_output = started
              follow_offset = 0
              timed_out = False
              kill_deadline = None
              process = None
              error = None
              exit_code = 1
              def interrupt(signum, _frame):
                  raise SignalTermination(signum)
              previous_handlers = {s: signal.signal(s, interrupt) for s in (signal.SIGTERM, signal.SIGINT)}
              def follow_raw(limit=4):
                  nonlocal follow_offset, last_output
                  if not args.follow_log or not Path(args.follow_log).exists():
                      return False
                  got_data = False
                  with Path(args.follow_log).open("rb") as source:
                      source.seek(follow_offset)
                      for _ in range(limit):
                          chunk = source.read(65536)
                          if not chunk:
                              break
                          sys.stdout.buffer.write(chunk)
                          sys.stdout.buffer.flush()
                          follow_offset += len(chunk)
                          last_output = time.monotonic()
                          got_data = True
                  return got_data
              print(f"BEGIN {args.name} timeout={args.timeout_seconds:g}s", flush=True)
              try:
                  with log_path.open("wb") as log, selectors.DefaultSelector() as selector:
                      process = subprocess.Popen(command, stdout=subprocess.PIPE,
                                                 stderr=subprocess.STDOUT,
                                                 start_new_session=True, bufsize=0)
                      selector.register(process.stdout, selectors.EVENT_READ)
                      while selector.get_map() or process.poll() is None:
                          follow_raw()
                          now = time.monotonic()
                          if now >= deadline and not timed_out:
                              timed_out = True
                              print(f"\nTIMEOUT {args.name}; terminating command group", flush=True)
                              kill_deadline = now + 5
                              try:
                                  os.killpg(process.pid, signal.SIGTERM)
                              except ProcessLookupError:
                                  pass
                          if kill_deadline is not None and now >= kill_deadline:
                              try:
                                  os.killpg(process.pid, signal.SIGKILL)
                              except ProcessLookupError:
                                  pass
                              kill_deadline = None
                          if now >= next_heartbeat:
                              print(f"\nHEARTBEAT {args.name} elapsed={now-started:.0f}s "
                                    f"last_output_age={now-last_output:.0f}s "
                                    f"process_running={process.poll() is None}", flush=True)
                              next_heartbeat = now + args.heartbeat_seconds
                          for key, _ in selector.select(timeout=0.2):
                              chunk = os.read(key.fd, 65536)
                              if not chunk:
                                  selector.unregister(key.fileobj)
                                  continue
                              log.write(chunk)
                              log.flush()
                              sys.stdout.buffer.write(chunk)
                              sys.stdout.buffer.flush()
                              last_output = time.monotonic()
                      result = process.wait()
                      while follow_raw():
                          pass
                      exit_code = 124 if timed_out else (result if result >= 0 else 128 - result)
              except BaseException as exc:
                  error = f"{type(exc).__name__}: {exc}"
                  exit_code = (128 + exc.signum if isinstance(exc, SignalTermination)
                               else 130 if isinstance(exc, KeyboardInterrupt) else 1)
              finally:
                  for sig in previous_handlers:
                      signal.signal(sig, signal.SIG_IGN)
                  if process is not None:
                      try:
                          os.killpg(process.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      try:
                          process.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          error = (error or "") + "; command group did not exit after SIGKILL"
                          exit_code = exit_code or 1
                  receipt = {
                      "name": args.name,
                      "started_at": started_at,
                      "finished_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      "elapsed_seconds": round(time.monotonic() - started, 3),
                      "timeout_seconds": args.timeout_seconds,
                      "timed_out": timed_out,
                      "exit_code": exit_code,
                      "error": error,
                  }
                  receipt_path.write_text(json.dumps(receipt, indent=2) + "\n")
                  print(f"\nEND {args.name} exit={exit_code} elapsed={receipt['elapsed_seconds']}s", flush=True)
                  for sig, previous in previous_handlers.items():
                      signal.signal(sig, previous)
              return exit_code


          if __name__ == "__main__":
              sys.exit(main())
          GATE_EOF
          cat > gate/orientation_scope.py <<'GATE_EOF'
          #!/usr/bin/env python3
          """Record a known orientation conflict without converting it to authority PASS."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          p = Path('evidence')
          raw = (p / 'context-capsule.txt').read_bytes()
          code = int(os.environ['CAPSULE_EXIT'])
          known = code == 4 and raw.decode().strip() == 'ERROR=AUTHORITY_UNRESOLVED\nAUTHORITY_FIELD=Status'
          status = 'PASS_ROUTING_VIEW' if code == 0 else 'RECORDED_DIAGNOSTIC' if known else 'STOP_UNEXPECTED_ORIENTATION_ERROR'
          receipt = {
              'status': status,
              'exit_code': code,
              'raw_sha256': hashlib.sha256(raw).hexdigest(),
              'capsule_source_sha256': hashlib.sha256(Path('product/tools/sharky_context_capsule_v2.sh').read_bytes()).hexdigest(),
              'reason': 'Known Status header conflict retained; diagnostic routing view is not acceptance authority.' if known else None,
              'authority_pass_claimed': False,
          }
          (p / 'orientation-diagnostic.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (p / 'task-scope.json').write_text(json.dumps({
              'product_sha': os.environ['PRODUCT_SHA'],
              'product_tree': os.environ['PRODUCT_TREE'],
              'base_sha': os.environ['BASE_SHA'],
              'parent_product_sha': os.environ['PARENT_PRODUCT_SHA'],
              'registrant_post_sha256': os.environ['REGISTRANT_POST_SHA256'],
              'product_pr': 'https://github.com/ClubBoss/sharky-standalone-direction/pull/443',
              'scope': ['exact 17-path source admission with reviewed two-line generated registrant repair', 'official Dart3.9 write formatter on exact eight paths in disposable checkout', 'preimage and postimage hashes plus complete patch', 'read-only idempotence on original 16 Dart paths'],
              'product_ownership': 'frozen input; eight local formatter outputs only; no product publication',
              'workflow_scope': 'isolated formatter artifact preparation, not validation acceptance',
              'strict_checks_retained': ['source SHA/tree', 'clean source', 'exact 17 changed paths', 'exact 16 Dart paths', 'dependency lock identity', 'exact eight changed paths', 'formatter-only custody', 'idempotence16'],
              'not_admitted': ['native build in this workflow', 'product publication', 'tests or analysis in this preparation', 'protected-gate changes', 'full DoD acceptance', 'score award'],
          }, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          if code != 0 and not known:
              sys.exit(code if 0 < code < 256 else 1)
          GATE_EOF
          cat > gate/expected-paths.txt <<'GATE_EOF'
          lib/ui_v2/act0_shell/academy_leaves/act0_academy_settings_leaf_v1.dart
          lib/ui_v2/act0_shell/act0_academy_runtime_adapter_v1.dart
          lib/ui_v2/act0_shell/act0_canonical_path_root_v1.dart
          lib/ui_v2/act0_shell/act0_dat07_canonical_store_port_v1.dart
          lib/ui_v2/act0_shell/act0_dat07_file_screen_v1.dart
          lib/ui_v2/act0_shell/act0_dat07_shell_host_v1.dart
          lib/ui_v2/act0_shell/act0_dat07_transfer_v1.dart
          lib/ui_v2/act0_shell/act0_progress_store_v1.dart
          lib/ui_v2/act0_shell/act0_shell_preview_screen_v1.dart
          lib/ui_v2/app_root.dart
          test/ui_v2/act0_dat07_canonical_store_port_v1_test.dart
          test/ui_v2/act0_dat07_file_screen_v1_test.dart
          test/ui_v2/act0_dat07_restore_faults_v1_test.dart
          test/ui_v2/act0_dat07_shell_integration_v1_test.dart
          test/ui_v2/act0_dat07_transfer_v1_test.dart
          test/ui_v2/act0_shell_preview_screen_v1_test.dart
          GATE_EOF
          cat > gate/expected-changed-paths.txt <<'GATE_EOF'
          lib/ui_v2/act0_shell/academy_leaves/act0_academy_settings_leaf_v1.dart
          lib/ui_v2/act0_shell/act0_academy_runtime_adapter_v1.dart
          lib/ui_v2/act0_shell/act0_canonical_path_root_v1.dart
          lib/ui_v2/act0_shell/act0_dat07_canonical_store_port_v1.dart
          lib/ui_v2/act0_shell/act0_dat07_file_screen_v1.dart
          lib/ui_v2/act0_shell/act0_dat07_shell_host_v1.dart
          lib/ui_v2/act0_shell/act0_dat07_transfer_v1.dart
          lib/ui_v2/act0_shell/act0_progress_store_v1.dart
          lib/ui_v2/act0_shell/act0_shell_preview_screen_v1.dart
          lib/ui_v2/app_root.dart
          macos/Flutter/GeneratedPluginRegistrant.swift
          test/ui_v2/act0_dat07_canonical_store_port_v1_test.dart
          test/ui_v2/act0_dat07_file_screen_v1_test.dart
          test/ui_v2/act0_dat07_restore_faults_v1_test.dart
          test/ui_v2/act0_dat07_shell_integration_v1_test.dart
          test/ui_v2/act0_dat07_transfer_v1_test.dart
          test/ui_v2/act0_shell_preview_screen_v1_test.dart
          GATE_EOF
          cat > gate/format8-paths.txt <<'GATE_EOF'
          lib/ui_v2/act0_shell/act0_dat07_file_screen_v1.dart
          lib/ui_v2/act0_shell/act0_dat07_shell_host_v1.dart
          lib/ui_v2/act0_shell/act0_dat07_transfer_v1.dart
          test/ui_v2/act0_dat07_canonical_store_port_v1_test.dart
          test/ui_v2/act0_dat07_file_screen_v1_test.dart
          test/ui_v2/act0_dat07_restore_faults_v1_test.dart
          test/ui_v2/act0_dat07_shell_integration_v1_test.dart
          test/ui_v2/act0_dat07_transfer_v1_test.dart
          GATE_EOF
      - name: Verify frozen source, exact repair, 17 changed paths and 16 Dart paths
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C product rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test -z "$(git -C product status --porcelain)"
          git -C product rev-parse HEAD HEAD^{tree} > evidence/product-identity.txt
          test "$(git -C product rev-parse HEAD^)" = "$PARENT_PRODUCT_SHA"
          git -C product rev-parse "$PARENT_PRODUCT_SHA" "${PARENT_PRODUCT_SHA}^{tree}" > evidence/product-parent-identity.txt
          test "$(git -C product diff --name-only "$PARENT_PRODUCT_SHA" "$PRODUCT_SHA")" = macos/Flutter/GeneratedPluginRegistrant.swift
          git -C product diff --binary "$PARENT_PRODUCT_SHA" "$PRODUCT_SHA" > evidence/approved-product-repair.patch
          test "$(sha256sum product/macos/Flutter/GeneratedPluginRegistrant.swift | cut -d' ' -f1)" = "$REGISTRANT_POST_SHA256"
          git -C product diff --name-only "$BASE_SHA" "$PRODUCT_SHA" | LC_ALL=C sort > evidence/actual-changed-paths.txt
          LC_ALL=C sort gate/expected-changed-paths.txt > evidence/expected-changed-paths.txt
          test "$(wc -l < evidence/actual-changed-paths.txt)" -eq 17
          diff -u evidence/expected-changed-paths.txt evidence/actual-changed-paths.txt
          git -C product diff --name-only "$BASE_SHA" "$PRODUCT_SHA" -- '*.dart' | LC_ALL=C sort > evidence/actual-paths.txt
          LC_ALL=C sort gate/expected-paths.txt > evidence/expected-paths.txt
          test "$(wc -l < evidence/actual-paths.txt)" -eq 16
          diff -u evidence/expected-paths.txt evidence/actual-paths.txt
          printf '%s\n' "$GITHUB_SHA" > evidence/workflow-sha.txt
          cp workflow/.github/workflows/dat07-cloud-focused50.yml evidence/workflow.yml
          (cd product && sha256sum pubspec.lock ios/Podfile.lock) > evidence/locks-before.sha256
          (cd product && xargs sha256sum < ../evidence/actual-paths.txt) > evidence/source-files.sha256
          (cd product && xargs sha256sum < ../evidence/actual-changed-paths.txt) > evidence/all-changed-source-files.sha256
          set +e
          (cd product && bash tools/sharky_context_capsule_v2.sh) > evidence/context-capsule.txt 2>&1
          CAPSULE_EXIT=$?
          set -e
          export CAPSULE_EXIT
          printf '%s\n' "$CAPSULE_EXIT" > evidence/context-capsule-exit-code.txt
          python3 gate/orientation_scope.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: false
      - name: Prepare official hosted dependencies and verify lock identity
        id: setup
        timeout-minutes: 12
        working-directory: product
        run: |
          set -euo pipefail
          python3 ../gate/run_logged.py --name flutter-version --log ../evidence/flutter-version-console.log --receipt ../evidence/flutter-version-receipt.json --follow-log ../evidence/dat07-flutter-version.raw.log --timeout-seconds 90 -- bash tools/sharky_compact_evidence_v1.sh --id dat07-flutter-version --dir ../evidence -- flutter --version --machine
          cp ../evidence/dat07-flutter-version.raw.log ../evidence/flutter.json
          python3 ../gate/run_logged.py --name dart-version --log ../evidence/dart-version-console.log --receipt ../evidence/dart-version-receipt.json --follow-log ../evidence/dat07-dart-version.raw.log --timeout-seconds 60 -- bash tools/sharky_compact_evidence_v1.sh --id dat07-dart-version --dir ../evidence -- dart --version
          cp ../evidence/dat07-dart-version.raw.log ../evidence/dart-version.txt
          python3 ../gate/run_logged.py --name pub-get --log ../evidence/pub-get-console.log --receipt ../evidence/pub-get-receipt.json --follow-log ../evidence/dat07-pub-get.raw.log --timeout-seconds 480 -- bash tools/sharky_compact_evidence_v1.sh --id dat07-pub-get --dir ../evidence -- flutter pub get
          (sha256sum pubspec.lock ios/Podfile.lock) > ../evidence/locks-after.sha256
          diff -u ../evidence/locks-before.sha256 ../evidence/locks-after.sha256
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Produce official formatter output for exact eight owned files
        id: formatter
        timeout-minutes: 4
        working-directory: product
        run: |
          set -euo pipefail
          python3 - <<'VERSION'
          import json
          from pathlib import Path
          v=json.loads(Path('../evidence/flutter.json').read_text())
          assert v['frameworkVersion']=='3.35.0', v
          assert v['dartSdkVersion']=='3.9.0', v
          VERSION
          test -z "$(git status --porcelain --untracked-files=no)"
          mapfile -t PATHS < ../gate/format8-paths.txt
          test "${#PATHS[@]}" -eq 8
          python3 - <<'PRE'
          from pathlib import Path
          import subprocess
          for name in Path('../gate/format8-paths.txt').read_text().splitlines():
              src=Path(name)
              assert src.is_file() and not src.is_symlink(), name
              data=subprocess.check_output(['git','show','HEAD:'+name])
              assert src.read_bytes()==data, name
              dst=Path('../evidence/formatter/preimages')/name
              dst.parent.mkdir(parents=True,exist_ok=True)
              dst.write_bytes(data)
          PRE
          python3 ../gate/run_logged.py --name format8-write --log ../evidence/formatter-console.log --receipt ../evidence/formatter-receipt.json --follow-log ../evidence/dat07-format8-write.raw.log --timeout-seconds 180 -- bash tools/sharky_compact_evidence_v1.sh --id dat07-format8-write --dir ../evidence -- dart format --output=write "${PATHS[@]}"
      - name: Verify bounded formatter delta and preserve exact postimages
        id: custody
        run: |
          set -euo pipefail
          git -C product diff --name-only | LC_ALL=C sort > evidence/formatter-actual-paths.txt
          LC_ALL=C sort gate/format8-paths.txt > evidence/formatter-expected-paths.txt
          diff -u evidence/formatter-expected-paths.txt evidence/formatter-actual-paths.txt
          test "$(git -C product diff --name-status | awk '$1 != "M" { print }')" = ''
          git -C product diff --check
          (cd product && sha256sum pubspec.lock ios/Podfile.lock) > evidence/locks-postformat.sha256
          diff -u evidence/locks-before.sha256 evidence/locks-postformat.sha256
          python3 - <<'POST'
          from pathlib import Path
          import hashlib,json,subprocess,os
          p=Path('evidence/formatter'); rows=[]
          for name in Path('gate/format8-paths.txt').read_text().splitlines():
              src=Path('product')/name
              assert src.is_file() and not src.is_symlink(), name
              after=src.read_bytes(); before=(p/'preimages'/name).read_bytes()
              assert before != after, name
              dst=p/'postimages'/name
              dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(after)
              blob=lambda b:hashlib.sha1(('blob '+str(len(b))+'\0').encode()+b).hexdigest()
              rows.append({'path':name,'before_sha256':hashlib.sha256(before).hexdigest(),'after_sha256':hashlib.sha256(after).hexdigest(),'before_blob':blob(before),'after_blob':blob(after),'before_bytes':len(before),'after_bytes':len(after)})
          patch=subprocess.check_output(['git','-C','product','diff','--binary','--no-ext-diff'])
          (p/'format8.patch').write_bytes(patch)
          receipt={'status':'OFFICIAL_FORMATTER_OUTPUT_FOR_REVIEW','product_sha':os.environ['PRODUCT_SHA'],'product_tree':os.environ['PRODUCT_TREE'],'formatter':'Dart3.9.0 via Flutter3.35.0','patch_sha256':hashlib.sha256(patch).hexdigest(),'files':rows,'semantic_equivalence':'PENDING_INDEPENDENT_REVIEW','test_cases_executed':0}
          (p/'manifest.json').write_text(json.dumps(receipt,indent=2)+'\n')
          POST
      - name: Verify formatter idempotence on all original sixteen paths
        id: idempotence
        timeout-minutes: 4
        working-directory: product
        run: |
          set -euo pipefail
          mapfile -t PATHS < ../gate/expected-paths.txt
          python3 ../gate/run_logged.py --name format16-idempotence --log ../evidence/idempotence-console.log --receipt ../evidence/idempotence-receipt.json --follow-log ../evidence/dat07-format16-idempotence.raw.log --timeout-seconds 180 -- bash tools/sharky_compact_evidence_v1.sh --id dat07-format16-idempotence --dir ../evidence -- dart format --output=none --set-exit-if-changed "${PATHS[@]}"
      - name: Seal all preparation evidence without claiming test acceptance
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          FORMATTER_OUTCOME: ${{ steps.formatter.outcome }}
          CUSTODY_OUTCOME: ${{ steps.custody.outcome }}
          IDEMPOTENCE_OUTCOME: ${{ steps.idempotence.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp -R gate evidence/gate
          git -C product diff --binary --no-ext-diff > evidence/final-full-source.patch
          git -C product status --porcelain --untracked-files=no > evidence/final-status.txt
          python3 - <<'RECEIPT'
          import json, os, subprocess
          from pathlib import Path
          p=Path('evidence')
          outcomes={k:os.environ.get(k,'') for k in ('SETUP_OUTCOME','FORMATTER_OUTCOME','CUSTODY_OUTCOME','IDEMPOTENCE_OUTCOME')}
          actual=subprocess.check_output(['git','-C','product','diff','--name-only'],text=True).splitlines()
          expected=Path('gate/format8-paths.txt').read_text().splitlines()
          scope_ok=sorted(actual)==sorted(expected)
          patch=p/'formatter/format8.patch'
          custody_ok=patch.exists() and patch.read_bytes()==(p/'final-full-source.patch').read_bytes()
          prepared=all(v=='success' for v in outcomes.values()) and scope_ok and custody_ok
          receipt={'status':'FORMATTER_ARTIFACT_PREPARED_NOT_TESTED' if prepared else 'FORMATTER_PREPARATION_FAILED','product_sha':os.environ['PRODUCT_SHA'],'product_tree':os.environ['PRODUCT_TREE'],'outcomes':outcomes,'exact_eight_path_scope':scope_ok,'final_patch_matches_custody':custody_ok,'test_cases_executed':0,'orientation_diagnostic':json.loads((p/'orientation-diagnostic.json').read_text()) if (p/'orientation-diagnostic.json').exists() else None,'not_proven':['semantic equivalence pending independent review','analyzer','DAT50','native Files/share','native restore','true process restart','full DAT-07 DoD','score acceptance']}
          (p/'verdict.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          RECEIPT
          (cd evidence && find . -type f ! -name evidence.sha256 -print0 | sort -z | xargs -0 sha256sum > evidence.sha256)
          cat evidence/verdict.json >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; assert json.load(open("evidence/verdict.json"))["status"] == "FORMATTER_ARTIFACT_PREPARED_NOT_TESTED"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dat07-format8-artifact-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
