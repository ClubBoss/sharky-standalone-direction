name: Learner Trust
on:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Recap RED and candidate regression
        run: |
          mkdir -p output/learner_trust
          git rev-parse HEAD HEAD^{tree} > output/learner_trust/source.txt
          flutter test test/ui_v2/act0_learner_trust_recap_v1_test.dart --reporter expanded > output/learner_trust/recaps.log 2>&1
      - name: Publish bounded test log
        if: always()
        run: cat output/learner_trust/recaps.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learner-trust-evidence
          path: output/learner_trust
