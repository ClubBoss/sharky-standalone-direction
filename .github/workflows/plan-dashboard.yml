name: Plan dashboard

on:
  pull_request:
    paths: ['docs/PLAN.md', 'tools/plan_dashboard_v1.py']

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dashboard matches the plan tables
        run: python3 tools/plan_dashboard_v1.py --check
      - name: Every pre-beta criterion has a block
        run: python3 tools/plan_coverage_check_v1.py
