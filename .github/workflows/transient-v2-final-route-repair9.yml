name: Transient V2 repair-intent diagnostic
on:
  push:
    branches:
      - sol-transient/v2-final-route-repair9
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e917e7204af860739ccf146061f189c305696d9e
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Reproduce Tier-A repair intent failure
        run: flutter test test/ui_v2/act0_repair_intent_resolver_v1_test.dart -r expanded
