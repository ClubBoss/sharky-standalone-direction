name: Transient V2 canonical exit allocation reconciliation
on:
  push:
    branches:
      - sol-transient/v2-final-route-repair9
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 56c3ee2a7ebd6304b7c9bc7ae4be9ef1a0daacd3
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Reconcile canonical exit allocation and prove route
        shell: bash
        run: |
          set -euo pipefail
          BASE='56c3ee2a7ebd6304b7c9bc7ae4be9ef1a0daacd3'
          EXPECTED_MAIN='a5c7d94d31ea6f2f2ff7d1cf2ceb0856cd7f26a6'
          TARGET_BRANCH='kaizen/integrated-2-5d-v2-production-migration-v1'
          FILE='lib/ui_v2/act0_shell/act0_lesson_runner_shell_v1.dart'
          OLD_STAGE_B64=''
          NEW_STAGE_B64='ICAgICAgICAgICAgICBpZiAoIV91c2VzQ2Fub25pY2FsSW50ZWdyYXRlZExlYXJuaW5nU2NlbmVWMSkKICAgICAgICAgICAgICAgIF9SdW5uZXJQcm9ncmVzc1YxKHJ1bm5lcjogcnVubmVyLCBvbkJhY2s6IHdpZGdldC5vbkJhY2spLA=='
          OLD_TOP_B64=''
          NEW_TOP_B64=''

          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$BASE"

          export FILE OLD_STAGE_B64 NEW_STAGE_B64 OLD_TOP_B64 NEW_TOP_B64
          python3 -c "from pathlib import Path; import base64, os; p=Path(os.environ['FILE']); s=p.read_text(); pairs=[(base64.b64decode(os.environ['OLD_STAGE_B64']).decode(),base64.b64decode(os.environ['NEW_STAGE_B64']).decode()),(base64.b64decode(os.environ['OLD_TOP_B64']).decode(),base64.b64decode(os.environ['NEW_TOP_B64']).decode())]; [(None if s.count(old)==1 else (_ for _ in ()).throw(SystemExit(f'expected one match, found {s.count(old)}'))) for old,new in pairs]; s=s.replace(pairs[0][0],pairs[0][1]).replace(pairs[1][0],pairs[1][1]); p.write_text(s)"

          git diff --check "$BASE" -- "$FILE"
          dart format --output=none --set-exit-if-changed "$FILE"
          test "$(git diff --name-only "$BASE" -- "$FILE")" = "$FILE"
          test "$(git diff --numstat "$BASE" -- "$FILE")" = $'3\t4\t'$FILE
          git diff --unified=8 "$BASE" -- "$FILE"

          flutter test test/ui_v2/act0_telemetry_sink_v1_test.dart --plain-name 'unlocked Action capability journey completes the alpha loop with ordered safe telemetry'

          git config user.name 'Sharky Migration Executor'
          git config user.email 'actions@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'fix(act0): allocate canonical runner exit above scene'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$FILE"
          test "$(git rev-parse HEAD^)" = "$BASE"
          echo "RECONCILIATION_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
