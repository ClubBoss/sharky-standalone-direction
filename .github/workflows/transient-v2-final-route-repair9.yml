name: Transient V2 bounded repair 2
on:
  push:
    branches:
      - sol-transient/v2-final-route-repair9
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e917e7204af860739ccf146061f189c305696d9e
          fetch-depth: 2
      - name: Apply exact ownership split
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python3 -c "import base64,os,pathlib; p=pathlib.Path('lib/ui_v2/act0_shell/act0_lesson_runner_shell_v1.dart'); t=p.read_text(); o=base64.b64decode(os.environ['OLD_B64']).decode(); n=base64.b64decode(os.environ['NEW_B64']).decode(); assert t.count(o)==1, t.count(o); p.write_text(t.replace(o,n))"
          git diff --check
          test "$(git diff --name-only)" = "lib/ui_v2/act0_shell/act0_lesson_runner_shell_v1.dart"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Repair-intent regression
        run: flutter test test/ui_v2/act0_repair_intent_resolver_v1_test.dart -r compact
      - name: Action exit telemetry
        run: flutter test test/ui_v2/act0_telemetry_sink_v1_test.dart --plain-name "unlocked Action capability journey completes the alpha loop with ordered safe telemetry"
      - name: Commit repair
        run: |
          git add lib/ui_v2/act0_shell/act0_lesson_runner_shell_v1.dart
          test "$(git diff --cached --name-only)" = "lib/ui_v2/act0_shell/act0_lesson_runner_shell_v1.dart"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(act0): restore canonical non-shared runner exit owner"
          git push origin HEAD:kaizen/integrated-2-5d-v2-production-migration-v1
