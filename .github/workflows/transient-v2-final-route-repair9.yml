name: Transient V2 canonical exit allocation repair 1
on:
  push:
    branches:
      - sol-transient/v2-final-route-repair9
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 56c3ee2a7ebd6304b7c9bc7ae4be9ef1a0daacd3
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Reuse existing lower navigation as canonical exit owner
        shell: bash
        run: |
          set -euo pipefail
          BASE='56c3ee2a7ebd6304b7c9bc7ae4be9ef1a0daacd3'
          EXPECTED_MAIN='a5c7d94d31ea6f2f2ff7d1cf2ceb0856cd7f26a6'
          TARGET_BRANCH='kaizen/integrated-2-5d-v2-production-migration-v1'
          RUNNER='lib/ui_v2/act0_shell/act0_lesson_runner_shell_v1.dart'
          TEST='test/ui_v2/act0_telemetry_sink_v1_test.dart'
          OLD_STAGE_B64=''
          NEW_STAGE_B64='ICAgICAgICAgICAgICBpZiAoIV91c2VzQ2Fub25pY2FsSW50ZWdyYXRlZExlYXJuaW5nU2NlbmVWMSkKICAgICAgICAgICAgICAgIF9SdW5uZXJQcm9ncmVzc1YxKHJ1bm5lcjogcnVubmVyLCBvbkJhY2s6IHdpZGdldC5vbkJhY2spLA=='
          OLD_RAIL_B64=''
          NEW_RAIL_B64=''
          OLD_TEST_B64='YXdhaXQgdGVzdGVyLnRhcChmaW5kLmJ5S2V5KGNvbnN0IEtleSgnYWN0MF9zaGVsbF9ydW5uZXJfYmFjaycpKSk7'
          NEW_TEST_B64='YXdhaXQgdGVzdGVyLnRhcChmaW5kLmJ5S2V5KGNvbnN0IEtleSgnYWN0MF9zaGVsbF9wcmV2aW91c19jdGEnKSkpOw=='

          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"

          export RUNNER TEST OLD_STAGE_B64 NEW_STAGE_B64 OLD_RAIL_B64 NEW_RAIL_B64 OLD_TEST_B64 NEW_TEST_B64
          python3 - <<'PY'
          from pathlib import Path
          import base64, os

          def dec(name):
              return base64.b64decode(os.environ[name]).decode()

          runner = Path(os.environ['RUNNER'])
          source = runner.read_text()
          pairs = [
              (dec('OLD_STAGE_B64'), dec('NEW_STAGE_B64')),
              (dec('OLD_RAIL_B64'), dec('NEW_RAIL_B64')),
          ]
          for old, new in pairs:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'runner replacement expected once, found {count}')
              source = source.replace(old, new)
          runner.write_text(source)

          test_path = Path(os.environ['TEST'])
          test_source = test_path.read_text()
          old_test, new_test = dec('OLD_TEST_B64'), dec('NEW_TEST_B64')
          count = test_source.count(old_test)
          if count != 1:
              raise SystemExit(f'test replacement expected once, found {count}')
          test_path.write_text(test_source.replace(old_test, new_test))
          PY

          git diff --check "$BASE" -- "$RUNNER" "$TEST"
          test "$(git diff --name-only "$BASE" -- "$RUNNER" "$TEST" | sort)" = $'lib/ui_v2/act0_shell/act0_lesson_runner_shell_v1.dart\ntest/ui_v2/act0_telemetry_sink_v1_test.dart'
          git diff --unified=8 "$BASE" -- "$RUNNER" "$TEST"

          flutter test "$TEST" --plain-name 'unlocked Action capability journey completes the alpha loop with ordered safe telemetry'

          git config user.name 'Sharky Migration Executor'
          git config user.email 'actions@users.noreply.github.com'
          git add "$RUNNER" "$TEST"
          git commit -m 'fix(act0): route canonical exit through learning rail'
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = $'lib/ui_v2/act0_shell/act0_lesson_runner_shell_v1.dart\ntest/ui_v2/act0_telemetry_sink_v1_test.dart'
          echo "REPAIR1_SHA=$(git rev-parse HEAD)"
          git push --force origin HEAD:refs/heads/$TARGET_BRANCH
