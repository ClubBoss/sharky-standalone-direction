name: Transient V2 exact-main proof
on:
  push:
    branches:
      - sol-transient/v2-final-route-repair9
permissions:
  contents: read
jobs:
  exact-main:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      MAIN_SHA: 90e3b5a67a85424be457a946c629e88a578661e4
      EXPECTED_TREE: 8bc1c2c402b37fffe32a2f2baac64e448f407778
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 90e3b5a67a85424be457a946c629e88a578661e4
          fetch-depth: 2
      - name: Assert exact merged main and retained tree identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse 6ae270e042b04dbeada6d25f15b1945ef901e2d3^{tree})" = "$EXPECTED_TREE"
          git diff --check HEAD^1 HEAD
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze exact main
        run: flutter analyze
      - name: Exact-main route semantics
        run: |
          set -euo pipefail
          flutter test test/ui_v2/alpha_journey_progression_truth_v1_test.dart -r compact
          flutter test test/ui_v2/act0_telemetry_sink_v1_test.dart --plain-name "unlocked Action capability journey completes the alpha loop with ordered safe telemetry"
          flutter test test/ui_v2/act0_repair_intent_resolver_v1_test.dart -r compact
      - name: Exact-main production-real iphone17 and compact
        run: |
          set -euo pipefail
          dart run tools/act0_production_real_runner_capture_v1.dart iphone17_class
          dart run tools/act0_production_real_runner_capture_v1.dart compact
      - name: Exact-main canonical ownership proof
        run: |
          set -euo pipefail
          ! grep -R "integratedLearningScenePrototype" lib/ui_v2/act0_shell
          ! grep -R "INTEGRATED_2_5D_PROTOTYPE" lib/ui_v2/act0_shell test/ui_v2/action_sequence_canonical_raster_capture_v1_test.dart
          grep -n "_usesCanonicalIntegratedLearningSceneV1 => true" lib/ui_v2/act0_shell/act0_lesson_runner_shell_v1.dart
      - name: Package exact-main proof
        run: |
          mkdir -p output/exact_main_meta
          printf '%s\n' "$MAIN_SHA" > output/exact_main_meta/main-sha.txt
          printf '%s\n' "$EXPECTED_TREE" > output/exact_main_meta/tree-sha.txt
          flutter --version > output/exact_main_meta/flutter-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v2-exact-main-proof-90e3b5a6
          path: |
            output/exact_main_meta
            output/visual_master_audit/raw/live_runner_iphone17_class_none_v1
            output/visual_master_audit/raw/live_runner_compact_none_v1
          if-no-files-found: error
          retention-days: 7
