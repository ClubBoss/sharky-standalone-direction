name: Web Mirror Raw Pointer and Surface Proof v2

on:
  push:
    branches:
      - probe/web-mirror-feasibility-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-pointer-surface-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_MAIN_SHA: 838a803aebdd8196125e430dd380fb98b3a49afa
      RELEASE_URL: http://127.0.0.1:7357/
      CAPTURE_URL: http://127.0.0.1:7358/
    steps:
      - name: Checkout exact probe SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify temporary diff boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${PRODUCT_MAIN_SHA}" "${GITHUB_SHA}" | tee /tmp/current_delta.txt
          if [[ "$(cat /tmp/current_delta.txt)" != ".github/workflows/web-mirror-raw-pointer-surface-proof-v2.yml" ]]; then
            echo "Unexpected tree delta from product main" >&2
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Record build identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-proof-v2
          {
            echo "product_main_sha=${PRODUCT_MAIN_SHA}"
            echo "probe_sha=${GITHUB_SHA}"
            flutter --version
            dart --version
          } | tee runtime-proof-v2/build_identity.txt

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter web release build
        run: flutter build web --release

      - name: Verify release artifact
        run: test -f build/web/index.html

      - name: Install transient Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sharky-runtime-pw-v2
          cd /tmp/sharky-runtime-pw-v2
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve release artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 7357 --bind 127.0.0.1 --directory build/web >runtime-proof-v2/release_static_server.log 2>&1 &
          echo $! >/tmp/sharky_release_server_v2.pid
          for i in $(seq 1 30); do
            if curl -fsS "${RELEASE_URL}" >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Chromium release raw pointer proof
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/sharky-runtime-pw-v2/raw_pointer.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const out = path.join(process.env.GITHUB_WORKSPACE, 'runtime-proof-v2');
          const url = process.env.RELEASE_URL;
          const consoleEntries = [];
          const pageErrors = [];
          const failedRequests = [];
          const badResponses = [];
          const hash = buffer => crypto.createHash('sha256').update(buffer).digest('hex');
          const browser = await chromium.launch({ headless: true });
          const browserVersion = browser.version();
          const context = await browser.newContext({ viewport: { width: 402, height: 874 }, locale: 'en-US', colorScheme: 'dark' });
          const page = await context.newPage();
          page.on('console', m => consoleEntries.push({ type: m.type(), text: m.text() }));
          page.on('pageerror', e => pageErrors.push({ name: e.name, message: e.message, stack: e.stack || '' }));
          page.on('requestfailed', r => failedRequests.push({ url: r.url(), method: r.method(), failure: r.failure()?.errorText || 'unknown' }));
          page.on('response', r => { if (r.status() >= 400) badResponses.push({ url: r.url(), status: r.status() }); });
          const shot = async name => {
            const buf = await page.screenshot({ path: path.join(out, `${name}.png`), fullPage: true });
            return { sha256: hash(buf), bytes: buf.length };
          };
          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(3500);
          const before = await shot('raw_00_before');
          await page.mouse.move(201, 844);
          await page.mouse.down();
          await page.waitForTimeout(80);
          await page.mouse.up();
          await page.waitForTimeout(1400);
          const after = await shot('raw_01_after');
          await page.waitForTimeout(900);
          const stable = await shot('raw_02_after_stable');
          const rawPointerPass = before.sha256 !== stable.sha256 && after.sha256 === stable.sha256;
          const summary = {
            productMainSha: process.env.PRODUCT_MAIN_SHA,
            probeSha: process.env.GITHUB_SHA,
            browser: 'Chromium',
            browserVersion,
            viewport: { width: 402, height: 874 },
            releaseUrl: url,
            semanticsActivated: false,
            interactionArchitecture: 'raw_page_mouse_coordinates_only',
            coordinates: { x: 201, y: 844 },
            rawPointerPass,
            before,
            after,
            stable,
            consoleErrorCount: consoleEntries.filter(e => e.type === 'error').length,
            pageErrorCount: pageErrors.length,
            failedRequestCount: failedRequests.length,
            http400PlusCount: badResponses.length,
          };
          fs.writeFileSync(path.join(out, 'raw_pointer_summary.json'), JSON.stringify(summary, null, 2));
          fs.writeFileSync(path.join(out, 'raw_console.json'), JSON.stringify(consoleEntries, null, 2));
          fs.writeFileSync(path.join(out, 'raw_page_errors.json'), JSON.stringify(pageErrors, null, 2));
          fs.writeFileSync(path.join(out, 'raw_failed_requests.json'), JSON.stringify(failedRequests, null, 2));
          fs.writeFileSync(path.join(out, 'raw_http_400_plus.json'), JSON.stringify(badResponses, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          await browser.close();
          if (!rawPointerPass) process.exit(2);
          JS
          if grep -Eq 'flt-semantics-placeholder|getByRole|getByText|locator\(|\.click\(' /tmp/sharky-runtime-pw-v2/raw_pointer.mjs; then
            echo "Forbidden semantics/locator interaction primitive present" >&2
            exit 1
          fi
          echo "SEMANTICS_ACTIVATED=NO" | tee runtime-proof-v2/semantics_invariant.txt
          cd /tmp/sharky-runtime-pw-v2
          node raw_pointer.mjs | tee "${GITHUB_WORKSPACE}/runtime-proof-v2/raw_pointer_stdout.txt"

      - name: Stop release server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/sharky_release_server_v2.pid ]]; then
            kill "$(cat /tmp/sharky_release_server_v2.pid)" >/dev/null 2>&1 || true
          fi

      - name: Build existing capture harness in non-release mode
        run: flutter build web --debug

      - name: Verify capture artifact
        run: test -f build/web/index.html

      - name: Serve existing capture harness artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 7358 --bind 127.0.0.1 --directory build/web >runtime-proof-v2/capture_static_server.log 2>&1 &
          echo $! >/tmp/sharky_capture_server_v2.pid
          for i in $(seq 1 30); do
            if curl -fsS "${CAPTURE_URL}" >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Chromium existing Act0 capture surface proof
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/sharky-runtime-pw-v2/surfaces.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const out = path.join(process.env.GITHUB_WORKSPACE, 'runtime-proof-v2');
          const baseUrl = process.env.CAPTURE_URL;
          const results = [];
          const allPageErrors = [];
          const allFailedRequests = [];
          const allBadResponses = [];
          const allConsole = [];
          const hash = buffer => crypto.createHash('sha256').update(buffer).digest('hex');
          const browser = await chromium.launch({ headless: true });
          const browserVersion = browser.version();
          const context = await browser.newContext({ viewport: { width: 402, height: 874 }, locale: 'en-US', colorScheme: 'dark' });
          const page = await context.newPage();
          page.on('console', m => allConsole.push({ type: m.type(), text: m.text(), href: page.url() }));
          page.on('pageerror', e => allPageErrors.push({ name: e.name, message: e.message, stack: e.stack || '', href: page.url() }));
          page.on('requestfailed', r => allFailedRequests.push({ url: r.url(), method: r.method(), failure: r.failure()?.errorText || 'unknown', href: page.url() }));
          page.on('response', r => { if (r.status() >= 400) allBadResponses.push({ url: r.url(), status: r.status(), href: page.url() }); });

          for (const surface of ['home', 'learn', 'runner_drill', 'runner_feedback', 'review', 'profile']) {
            const e0 = allPageErrors.length;
            const f0 = allFailedRequests.length;
            const b0 = allBadResponses.length;
            await page.goto(`${baseUrl}?act0_capture=${surface}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(3000);
            const buf = await page.screenshot({ path: path.join(out, `surface_${surface}.png`), fullPage: true });
            const probe = await page.evaluate(() => ({ href: location.href, width: innerWidth, height: innerHeight, hasGlassPane: !!document.querySelector('flt-glass-pane') }));
            results.push({
              surface,
              probe,
              screenshotBytes: buf.length,
              screenshotSha256: hash(buf),
              pageErrors: allPageErrors.length - e0,
              failedRequests: allFailedRequests.length - f0,
              http400Plus: allBadResponses.length - b0,
            });
          }

          const uniqueHashes = new Set(results.map(r => r.screenshotSha256)).size;
          const summary = {
            productMainSha: process.env.PRODUCT_MAIN_SHA,
            probeSha: process.env.GITHUB_SHA,
            browser: 'Chromium',
            browserVersion,
            viewport: { width: 402, height: 874 },
            captureUrl: baseUrl,
            captureBuildMode: 'debug_non_release_existing_harness',
            semanticsActivated: false,
            results,
            uniqueScreenshotHashes: uniqueHashes,
            consoleErrorCount: allConsole.filter(e => e.type === 'error').length,
            pageErrorCount: allPageErrors.length,
            failedRequestCount: allFailedRequests.length,
            http400PlusCount: allBadResponses.length,
          };
          fs.writeFileSync(path.join(out, 'surface_summary.json'), JSON.stringify(summary, null, 2));
          fs.writeFileSync(path.join(out, 'surface_console.json'), JSON.stringify(allConsole, null, 2));
          fs.writeFileSync(path.join(out, 'surface_page_errors.json'), JSON.stringify(allPageErrors, null, 2));
          fs.writeFileSync(path.join(out, 'surface_failed_requests.json'), JSON.stringify(allFailedRequests, null, 2));
          fs.writeFileSync(path.join(out, 'surface_http_400_plus.json'), JSON.stringify(allBadResponses, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          await browser.close();
          if (results.length !== 6 || uniqueHashes < 6 || results.some(r => r.screenshotBytes < 12000 || r.pageErrors || r.failedRequests || r.http400Plus)) process.exit(3);
          JS
          if grep -Eq 'flt-semantics-placeholder|getByRole|getByText|locator\(|\.click\(' /tmp/sharky-runtime-pw-v2/surfaces.mjs; then
            echo "Forbidden semantics/locator interaction primitive present" >&2
            exit 1
          fi
          cd /tmp/sharky-runtime-pw-v2
          node surfaces.mjs | tee "${GITHUB_WORKSPACE}/runtime-proof-v2/surface_stdout.txt"

      - name: Record temporary diff hygiene
        if: always()
        shell: bash
        run: |
          {
            echo "product_main_sha=${PRODUCT_MAIN_SHA}"
            echo "probe_sha=${GITHUB_SHA}"
            echo "committed_delta:"
            git diff --name-status "${PRODUCT_MAIN_SHA}" "${GITHUB_SHA}"
            echo "working_tree:"
            git status --short
          } | tee runtime-proof-v2/diff_hygiene.txt

      - name: Upload V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharky-web-raw-pointer-surface-proof-${{ github.sha }}
          path: runtime-proof-v2
          if-no-files-found: error
          retention-days: 2
