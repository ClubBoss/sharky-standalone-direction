name: Sharky Web QA Mirror

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharky-web-qa-mirror-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      MIRROR_BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.121.0
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'

      - name: Build non-release QA mirror
        run: |
          set -euo pipefail
          flutter pub get
          flutter build web --debug

      - name: Add deployment-only QA tooling, metadata, and headers
        run: |
          set -euo pipefail
          cp tools/sharky_phone_lab_v1.html build/web/phone.html
          cat > build/web/sharky-mirror-build.json <<EOF
          {
            "product_sha": "${TARGET_SHA}",
            "event": "${{ github.event_name }}",
            "branch_or_pr": "${MIRROR_BRANCH}",
            "build_mode": "debug_non_release_qa_mirror"
          }
          EOF
          cat > build/web/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
          EOF

      - name: Deploy exact-SHA mirror to Cloudflare Pages
        id: deploy
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy build/web \
            --project-name sharky-qa-mirror \
            --branch "${MIRROR_BRANCH}" \
            --commit-hash "${TARGET_SHA}" | tee deploy-output.txt
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' deploy-output.txt | head -n 1)"
          test -n "${DEPLOYMENT_URL}"
          echo "url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"

      - name: Verify deployed exact-SHA mirror
        id: remote_smoke
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          retry_get() {
            local url="$1"
            local output="$2"
            local attempt code
            for attempt in $(seq 1 12); do
              code="$(curl --silent --show-error --location \
                --connect-timeout 10 --max-time 20 \
                --output "$output" --write-out '%{http_code}' \
                "$url" || true)"
              if [[ "$code" =~ ^2[0-9][0-9]$ ]]; then
                printf '%s' "$code"
                return 0
              fi
              if [[ "$attempt" -lt 12 ]]; then
                sleep 5
              fi
            done
            echo "Remote mirror did not return HTTP success after bounded retries: $url" >&2
            return 1
          }

          ROOT_HTTP="$(retry_get "${DEPLOYMENT_URL}/" /tmp/sharky-root.html)"
          BUILD_JSON_HTTP="$(retry_get "${DEPLOYMENT_URL}/sharky-mirror-build.json" /tmp/sharky-mirror-build.json)"
          OBSERVED_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["product_sha"])' /tmp/sharky-mirror-build.json)"
          if [[ "$OBSERVED_SHA" != "$TARGET_SHA" ]]; then
            echo "Remote mirror SHA mismatch: expected $TARGET_SHA, observed $OBSERVED_SHA" >&2
            exit 1
          fi
          HOME_HTTP="$(retry_get "${DEPLOYMENT_URL}/?act0_capture=home" /tmp/sharky-home.html)"
          LEARN_HTTP="$(retry_get "${DEPLOYMENT_URL}/?act0_capture=learn" /tmp/sharky-learn.html)"
          PHONE_HTTP="$(retry_get "${DEPLOYMENT_URL}/phone.html?profile=compact&surface=home" /tmp/sharky-phone.html)"

          {
            echo "## Exact-SHA remote smoke"
            echo
            echo "- Expected SHA: \`${TARGET_SHA}\`"
            echo "- Observed remote SHA: \`${OBSERVED_SHA}\`"
            echo "- EXACT_SHA_REMOTE_SMOKE=PASS"
            echo "- Verified deployment URL: ${DEPLOYMENT_URL}"
            echo "- Root HTTP: ${ROOT_HTTP}"
            echo "- Build JSON HTTP: ${BUILD_JSON_HTTP}"
            echo "- Home HTTP: ${HOME_HTTP}"
            echo "- Learn HTTP: ${LEARN_HTTP}"
            echo "- Phone Lab HTTP: ${PHONE_HTTP}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "observed_sha=${OBSERVED_SHA}" >> "$GITHUB_OUTPUT"
          echo "root_http=${ROOT_HTTP}" >> "$GITHUB_OUTPUT"
          echo "build_json_http=${BUILD_JSON_HTTP}" >> "$GITHUB_OUTPUT"
          echo "home_http=${HOME_HTTP}" >> "$GITHUB_OUTPUT"
          echo "learn_http=${LEARN_HTTP}" >> "$GITHUB_OUTPUT"
          echo "phone_http=${PHONE_HTTP}" >> "$GITHUB_OUTPUT"

      - name: Browser-proof Phone Lab logical viewport
        id: phone_browser
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          REAL_CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$REAL_CHROME_BIN"
          cat > /tmp/sharky-phone-lab-chrome-wrapper <<EOF
          #!/usr/bin/env bash
          exec "$REAL_CHROME_BIN" --disable-extensions --disable-component-extensions-with-background-pages "\$@"
          EOF
          chmod +x /tmp/sharky-phone-lab-chrome-wrapper
          CHROME_BIN=/tmp/sharky-phone-lab-chrome-wrapper
          export CHROME_BIN
          if node -e 'process.exit(typeof WebSocket === "function" ? 0 : 1)'; then
            node tools/sharky_phone_lab_browser_probe_v1.mjs \
              --base-url "$DEPLOYMENT_URL" \
              --target-sha "$TARGET_SHA" \
              --out output/phone_lab_browser
          else
            node --experimental-websocket tools/sharky_phone_lab_browser_probe_v1.mjs \
              --base-url "$DEPLOYMENT_URL" \
              --target-sha "$TARGET_SHA" \
              --out output/phone_lab_browser
          fi
          cat output/phone_lab_browser/browser-proof.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package SHARKY_EVIDENCE_V1
        id: evidence_package
        env:
          BASE_SHA_FROM_EVENT: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          BASE_SHA="$BASE_SHA_FROM_EVENT"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${TARGET_SHA}^")"
          fi
          python3 tools/package_sharky_evidence_v1.py \
            --proof-dir output/phone_lab_browser \
            --out-dir output/sharky_evidence \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-sha "$TARGET_SHA" \
            --base-sha "$BASE_SHA" \
            --pr-number "$PR_NUMBER" \
            --run-id "$GITHUB_RUN_ID" \
            --tooling-sha "$TARGET_SHA"
          cat "output/sharky_evidence/sharky-evidence-${TARGET_SHA}/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SHARKY_EVIDENCE_V1
        id: evidence_upload
        uses: actions/upload-artifact@v4
        with:
          name: sharky-evidence-${{ env.TARGET_SHA }}
          path: output/sharky_evidence/sharky-evidence-${{ env.TARGET_SHA }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish evidence discovery
        env:
          ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence_upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo "## SHARKY_EVIDENCE_V1"
            echo
            echo "- candidate_sha=\`${TARGET_SHA}\`"
            echo "- run_id=\`${GITHUB_RUN_ID}\`"
            echo "- artifact_name=\`sharky-evidence-${TARGET_SHA}\`"
            echo "- artifact_id=\`${ARTIFACT_ID}\`"
            echo "- artifact_digest=\`${ARTIFACT_DIGEST}\`"
            echo "- evidence_kind=\`phone_lab_browser\`"
            echo "- capture_authority=\`web_qa\`"
            echo "- native_acceptance_claimed=\`false\`"
            echo "- status=\`READY_FOR_EVALUATION\`"
            echo "- artifact_url=${ARTIFACT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw Phone Lab failure proof
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sharky-phone-lab-browser-proof-failure-${{ env.TARGET_SHA }}
          path: output/phone_lab_browser
          if-no-files-found: warn
          retention-days: 14

      - name: Publish preview links
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "## Sharky non-authoritative web QA mirror"
            echo
            echo "- Target SHA: \`${TARGET_SHA}\`"
            echo "- Build mode: \`debug_non_release_qa_mirror\`"
            echo "- [Preview root](${DEPLOYMENT_URL}/)"
            echo "- [Phone Lab — Compact](${DEPLOYMENT_URL}/phone.html?profile=compact&surface=live)"
            echo "- [Phone Lab — Tall](${DEPLOYMENT_URL}/phone.html?profile=tall&surface=live)"
            echo "- [Home](${DEPLOYMENT_URL}/?act0_capture=home)"
            echo "- [Learn](${DEPLOYMENT_URL}/?act0_capture=learn)"
            echo "- [Runner drill](${DEPLOYMENT_URL}/?act0_capture=runner_drill)"
            echo "- [Runner feedback](${DEPLOYMENT_URL}/?act0_capture=runner_feedback)"
            echo "- [Review](${DEPLOYMENT_URL}/?act0_capture=review)"
            echo "- [Profile](${DEPLOYMENT_URL}/?act0_capture=profile)"
            echo
            echo "Phone Lab is browser QA tooling only. Native iOS Simulator/device remains product authority."
          } >> "$GITHUB_STEP_SUMMARY"
