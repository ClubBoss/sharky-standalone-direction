name: PKR0205 exact Placement runtime falsifier and source hash
on:
  push:
    branches: [qa/pkr0205-placement-proof-20261110]
    paths: [.github/workflows/pkr0205-placement-proof.yml]
permissions:
  contents: read
concurrency:
  group: pkr0205-placement-proof-20261110
  cancel-in-progress: false
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c726a4210787cc9fe5e4686ba838ad6624adf703
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
      - name: Verify exact product identity and formatter delta
        run: |
          set -euo pipefail
          mkdir -p output/pkr0205-placement
          test "$(git rev-parse HEAD)" = c726a4210787cc9fe5e4686ba838ad6624adf703
          git rev-parse HEAD HEAD^{tree} > output/pkr0205-placement/head.txt
          sha256sum lib/ui_v2/act0_shell/act0_betting_price_contract_v1.dart > output/pkr0205-placement/price-sha256.txt
          dart format lib/ui_v2/act0_shell/act0_betting_price_contract_v1.dart test/ui_v2/act0_pkr02_05_placement_definition_v1_test.dart | tee output/pkr0205-placement/format.txt
          git diff -- lib/ui_v2/act0_shell/act0_betting_price_contract_v1.dart test/ui_v2/act0_pkr02_05_placement_definition_v1_test.dart > output/pkr0205-placement/format-delta.patch
          cp lib/ui_v2/act0_shell/act0_betting_price_contract_v1.dart output/pkr0205-placement/formatted-price.dart
          cp test/ui_v2/act0_pkr02_05_placement_definition_v1_test.dart output/pkr0205-placement/formatted-placement-test.dart
          flutter pub get
          dart analyze lib/ui_v2/act0_shell/act0_betting_price_contract_v1.dart test/ui_v2/act0_pkr02_05_placement_definition_v1_test.dart > output/pkr0205-placement/analyze.log 2>&1 || { cat output/pkr0205-placement/analyze.log; exit 1; }
      - name: Actual source and original independent test battery
        run: |
          set -euo pipefail
          flutter test test/ui_v2/act0_pkr02_05_placement_definition_v1_test.dart test/ui_v2/act0_betting_price_contract_v1_test.dart test/ui_v2/act0_pkr02_05_runtime_legality_v1_test.dart test/ui_v2/act0_pkr02_05_source_closure_v1_test.dart test/ui_v2/act0_pkr02_05_catalog_coverage_v1_test.dart test/ui_v2/act0_pkr02_05_early_fold_profile_v1_test.dart --reporter expanded > output/pkr0205-placement/targeted.log 2>&1 || { tail -n 90 output/pkr0205-placement/targeted.log; exit 1; }
          tail -n 12 output/pkr0205-placement/targeted.log
      - name: Original rendered Placement route regression
        run: |
          set -euo pipefail
          flutter test test/ui_v2/act0_repair_intent_lifecycle_v1_test.dart --reporter expanded > output/pkr0205-placement/placement-render.log 2>&1 || { tail -n 65 output/pkr0205-placement/placement-render.log; exit 1; }
          tail -n 12 output/pkr0205-placement/placement-render.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkr0205-placement-c726a42107
          path: output/pkr0205-placement/
          retention-days: 30
