name: Table Truth
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Resolve locked candidate graph and record source identity
        run: |
          mkdir -p output/table_truth
          git rev-parse HEAD HEAD^{tree} > output/table_truth/candidate-source.txt
          sha256sum pubspec.lock > output/table_truth/lock-before.txt
          flutter pub get
          sha256sum pubspec.lock > output/table_truth/lock-resolved.txt
      - name: Check exact-source formatting
        run: |
          FILES="lib/ui_v2/act0_shell/act0_shell_state_v1.dart lib/ui_v2/act0_shell/act0_lesson_runner_*_v1.dart lib/ui_v2/act0_shell/act0_table_choreography_contract_v1.dart test/support/act0_table_truth_v1.dart test/ui_v2/act0_table_truth_catalog_v1_test.dart test/ui_v2/act0_table_truth_falsifiers_v1_test.dart test/ui_v2/act0_source_scope_runner_v1_test.dart test/ui_v2/act0_source_scope_v1_test.dart test/ui_v2/act0_first_hand_truth_v1_test.dart test/ui_v2/act0_table_truth_mutation_v1_test.dart test/ui_v2/act0_table_truth_render_v1_test.dart"
          dart format --output=none --set-exit-if-changed $FILES
          mkdir -p output/table_truth/formatted
          cp --parents $FILES output/table_truth/formatted
      - name: GREEN catalog, falsifiers and affected source/render contracts
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/output/table_truth"
          set +e
          FOLD_CONTEXT_CAPTURE_DIR="$OUT/fold-context-frames" TABLE_TRUTH_OUTPUT="$OUT/candidate" flutter test test/ui_v2/act0_table_truth_catalog_v1_test.dart test/ui_v2/act0_first_hand_truth_v1_test.dart test/ui_v2/act0_table_truth_mutation_v1_test.dart test/ui_v2/act0_table_truth_render_v1_test.dart test/ui_v2/act0_table_truth_falsifiers_v1_test.dart test/ui_v2/act0_w11_poker_source_truth_v1_test.dart test/ui_v2/act0_source_scope_v1_test.dart test/ui_v2/act0_source_scope_runner_v1_test.dart test/ui_v2/act0_table_choreography_contract_v1_test.dart test/ui_v2/act0_street_replay_contract_v1_test.dart test/ui_v2/act0_fold_mechanical_context_v1_test.dart --machine > "$OUT/candidate-tests.jsonl" 2>&1
          code=$?
          set -e
          python3 tools/table_truth_evidence_v1.py tests "$OUT/candidate-tests.jsonl" green "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-truth-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/table_truth
