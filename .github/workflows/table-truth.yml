name: Table Truth
on:
  pull_request:
  push:
    branches: [main, codex/table-truth-cloud-20261103]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format candidate for verification and return exact formatted sources
        run: |
          dart format lib/ui_v2/act0_shell/act0_shell_state_v1.dart lib/ui_v2/act0_shell/act0_lesson_runner_shell_v1.dart lib/ui_v2/act0_shell/act0_table_choreography_contract_v1.dart test/support/act0_table_truth_v1.dart test/ui_v2/act0_table_truth_catalog_v1_test.dart test/ui_v2/act0_table_truth_falsifiers_v1_test.dart test/ui_v2/act0_source_scope_runner_v1_test.dart
          mkdir -p output/table_truth/formatted
          cp --parents lib/ui_v2/act0_shell/act0_shell_state_v1.dart lib/ui_v2/act0_shell/act0_lesson_runner_shell_v1.dart lib/ui_v2/act0_shell/act0_table_choreography_contract_v1.dart test/support/act0_table_truth_v1.dart test/ui_v2/act0_table_truth_catalog_v1_test.dart output/table_truth/formatted
      - name: Candidate classification (no invariant PASS claimed)
        env:
          TABLE_TRUTH_CENSUS_ONLY: '1'
          TABLE_TRUTH_OUTPUT: output/table_truth
        run: flutter test test/ui_v2/act0_table_truth_catalog_v1_test.dart -r expanded
      - name: Selected donor and preserved source contracts
        run: flutter test test/ui_v2/act0_first_hand_truth_v1_test.dart test/ui_v2/act0_table_truth_mutation_v1_test.dart test/ui_v2/act0_table_truth_render_v1_test.dart test/ui_v2/act0_w11_poker_source_truth_v1_test.dart test/ui_v2/act0_source_scope_v1_test.dart test/ui_v2/act0_source_scope_runner_v1_test.dart test/ui_v2/act0_table_truth_falsifiers_v1_test.dart test/ui_v2/act0_table_choreography_contract_v1_test.dart -r expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-truth-${{ github.sha }}
          path: output/table_truth
