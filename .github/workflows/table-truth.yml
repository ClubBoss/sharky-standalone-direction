name: Table Truth
on:
  pull_request:
  push:
    branches: [main, codex/table-truth-cloud-20261103]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Baseline classification (no invariant PASS claimed)
        env:
          TABLE_TRUTH_CENSUS_ONLY: '1'
          TABLE_TRUTH_OUTPUT: output/table_truth
        run: flutter test test/ui_v2/act0_table_truth_catalog_v1_test.dart -r expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-truth-${{ github.sha }}
          path: output/table_truth
