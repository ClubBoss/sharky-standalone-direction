name: dart-cli (CLI-only)

on:
  pull_request:
    paths:
      - "bin/**"
      - "ev/**"
      - "test/ev/**"
      - "test/content_audit_smoke_test.dart"
      - "tooling/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/cli-dart.yml"
  push:
    branches: [ main ]
    paths:
      - "bin/**"
      - "ev/**"
      - "test/ev/**"
      - "test/content_audit_smoke_test.dart"
      - "tooling/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/cli-dart.yml"

jobs:
  dart-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - run: dart --version

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Pub get
        run: flutter pub get

      - name: Format check (CLI only)
        run: dart format --output=none --set-exit-if-changed bin tooling

      - name: Analyze (CLI only)
        run: flutter analyze bin tooling

      # test/ev and content_audit_smoke_test are Tier C under the executable
      # test-authority SSOT. Their scheduled diagnostic lane remains the only
      # owner for non-blocking historical coverage.

      # Аудит контента только при изменениях в content/**
      - name: content audit (only if content changed)
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD | grep '^content/' || true)
          if [ -z "$CHANGED" ]; then
            echo "No content changes; skipping audit."
            exit 0
          fi
          if [ ! -f tooling/content_audit.dart ]; then
            echo "SKIP: tooling/content_audit.dart not present"
            exit 0
          fi
          MODULES=$(echo "$CHANGED" | awk -F/ '{print $2}' | sort -u)
          for m in $MODULES; do
            echo "Auditing $m"
            dart run tooling/content_audit.dart "$m"
          done
