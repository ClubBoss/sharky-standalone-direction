name: PKR0205 W1 source-repair diagnostic (does not admit product)
on:
  push:
    branches: [qa/pkr0205-w1-format-20261110]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 059f810521bcfbd9c0082882ac36df1d97b25051
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Format only in disposable workspace and export exact formatter output
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 059f810521bcfbd9c0082882ac36df1d97b25051
          mkdir -p output/w1-source-diagnostic/canonical
          flutter pub get
          FILES="lib/ui_v2/act0_shell/act0_shell_state_v1.dart lib/ui_v2/act0_shell/act0_betting_price_contract_v1.dart test/ui_v2/act0_pkr02_05_catalog_coverage_v1_test.dart test/ui_v2/act0_pkr02_05_w1_action_vocabulary_v1_test.dart"
          dart format $FILES | tee output/w1-source-diagnostic/format.txt
          git diff -- $FILES > output/w1-source-diagnostic/formatter.diff
          cp --parents $FILES output/w1-source-diagnostic/canonical/
          git rev-parse HEAD HEAD^{tree} > output/w1-source-diagnostic/initial-source.txt
      - name: Bounded true source and learner regression diagnostic
        run: |
          set +e
          flutter test test/ui_v2/act0_pkr02_05_w1_action_vocabulary_v1_test.dart test/ui_v2/act0_pkr02_05_catalog_coverage_v1_test.dart --machine > output/w1-source-diagnostic/targeted.jsonl 2>&1
          echo "$?" > output/w1-source-diagnostic/targeted-exit.txt
          flutter test test/ui_v2/act0_ldr01_durable_truth_v1_test.dart test/ui_v2/act0_learner_trust_continuation_v1_test.dart test/ui_v2/s09_b2_summary_home_truth_core_v1_test.dart --machine > output/w1-source-diagnostic/learner.jsonl 2>&1
          echo "$?" > output/w1-source-diagnostic/learner-exit.txt
          set -e
          python3 - <<'PY'
          import json,pathlib,collections
          root=pathlib.Path('output/w1-source-diagnostic')
          for tag in ('targeted','learner'):
              events=[]
              for line in (root/(tag+'.jsonl')).read_text().splitlines():
                  try:e=json.loads(line)
                  except json.JSONDecodeError:continue
                  if isinstance(e,dict):events.append(e)
              names={e['test']['id']:e['test']['name'] for e in events if e.get('type')=='testStart'}
              done=[e for e in events if e.get('type')=='testDone' and not e.get('hidden') and not names.get(e.get('testID'),'').startswith('loading ')]
              counts=collections.Counter(('skipped' if e.get('skipped') else e.get('result')) for e in done)
              failed=[names.get(e.get('testID'),'unknown') for e in done if e.get('result') in ('failure','error')]
              print('W1_DIAGNOSTIC',tag,'exit',(root/(tag+'-exit.txt')).read_text().strip(),'counts',dict(counts),'failed',failed[:30])
              assert len(done)>0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkr0205-w1-formatter-and-truth-${{ github.run_id }}
          path: output/w1-source-diagnostic/
          retention-days: 30
