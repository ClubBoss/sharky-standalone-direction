name: S11 hosted isolated native feasibility
on:
  push:
    branches:
      - qa/s11-hosted-native-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-native-feasibility:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exactly frozen PR 282 source
        uses: actions/checkout@v4
        with:
          ref: 42fb7506de2726923bb838ee1cbb67b6f4e90b13
          fetch-depth: 1
      - name: Verify source and available Xcode/iOS simulators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/s11_hosted
          test "$(git rev-parse HEAD)" = "42fb7506de2726923bb838ee1cbb67b6f4e90b13"
          test "$(git rev-parse HEAD^{tree})" = "ef22ad4ebf1b0d6769125cbe6d00249121564e17"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" | tee output/s11_hosted/environment.txt
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})" | tee -a output/s11_hosted/environment.txt
          echo "RUNNER_OS=$RUNNER_OS" | tee -a output/s11_hosted/environment.txt
          sw_vers | tee -a output/s11_hosted/environment.txt
          xcodebuild -version | tee -a output/s11_hosted/environment.txt
          xcrun simctl list runtimes | tee -a output/s11_hosted/environment.txt
          xcrun simctl list devices available -j > output/s11_hosted/devices.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Resolve existing dependencies and build single new simulator app
        shell: bash
        run: |
          set -euo pipefail
          flutter --version | tee -a output/s11_hosted/environment.txt
          flutter pub get > output/s11_hosted/pub-get.log 2>&1 || { tail -80 output/s11_hosted/pub-get.log; exit 1; }
          flutter build ios --simulator --debug > output/s11_hosted/build.log 2>&1 || { tail -110 output/s11_hosted/build.log; exit 1; }
          test -d build/ios/iphonesimulator/Runner.app
          ditto build/ios/iphonesimulator/Runner.app output/s11_hosted/Runner.app
          find output/s11_hosted/Runner.app -type f -print0 | xargs -0 shasum -a 256 > output/s11_hosted/app-file-manifest.sha256
          shasum -a 256 output/s11_hosted/app-file-manifest.sha256 > output/s11_hosted/manifest-file-sha.txt
          shasum -a 256 output/s11_hosted/Runner.app/Frameworks/App.framework/flutter_assets/kernel_blob.bin > output/s11_hosted/kernel-sha.txt
          echo "NEW_HOSTED_BINARY_NOT_HISTORIC_LOCAL_BINARY" | tee output/s11_hosted/binary-provenance.txt
          echo "source=42fb7506de2726923bb838ee1cbb67b6f4e90b13" >> output/s11_hosted/binary-provenance.txt
      - name: Boot one supported simulator and interact with native app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > output/s11_hosted/selected-simulator.txt
          import json
          data=json.load(open('output/s11_hosted/devices.json'))['devices']
          candidates=[d for runtime,devices in data.items() if 'iOS' in runtime for d in devices if d.get('isAvailable') and 'iPhone' in d.get('name','')]
          if not candidates: raise SystemExit('NO_AVAILABLE_IPHONE_SIMULATOR')
          print(candidates[0]['udid'])
          PY
          SIM_ID="$(cat output/s11_hosted/selected-simulator.txt)"
          echo "SIM_ID=$SIM_ID" | tee -a output/s11_hosted/environment.txt
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" output/s11_hosted/Runner.app
          xcrun simctl launch "$SIM_ID" com.example.pokerAnalyzer | tee output/s11_hosted/native-launch.txt
          sleep 8
          xcrun simctl io "$SIM_ID" screenshot output/s11_hosted/native-home.png
          test -s output/s11_hosted/native-home.png
          echo "NATIVE_INSTALL_LAUNCH_SCREENSHOT_PASS" | tee output/s11_hosted/native-verdict.txt
          xcrun simctl terminate "$SIM_ID" com.example.pokerAnalyzer || true
          xcrun simctl shutdown "$SIM_ID" || true
      - name: Upload exact binary, native screenshot and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s11-hosted-feasibility-${{ github.run_id }}
          path: output/s11_hosted/
          if-no-files-found: warn
          retention-days: 14
