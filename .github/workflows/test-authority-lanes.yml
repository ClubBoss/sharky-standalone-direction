name: Test Authority Lanes

on:
  pull_request:
    # Release and curriculum review docs need the same bounded PR checks.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/RELEASE.md'
      - 'docs/release/privacy_policy_1_0_en.md'
      - 'docs/plan/OWNER_CONCEPTS_ADDENDUM_v1.md'
      - 'docs/reference/LONG_TERM_WORLD_VISION_REFERENCE_v1.md'
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane to run"
        required: true
        default: "tier-a"
        type: choice
        options:
          - tier-a
          - tier-b
          - all-diagnostic
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: test-authority-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  canonical-authority:
    name: Canonical authority (Tier A ${{ matrix.shard }}/3)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'tier-a' || inputs.lane == 'all-diagnostic')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      # Tier A commands are split across three parallel jobs by expected time.
      TEST_AUTHORITY_SHARD: ${{ matrix.shard }}/3
      OBS04_RECEIPT_DIR: ${{ github.workspace }}/build/test_authority/obs04
      # Tier B runs in the parallel tier-b job on PR/push; same tests, less wall time.
      TEST_AUTHORITY_SKIP_TIER_B: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true
      - run: flutter pub get
      - name: Prepare OBS04 execution manifest
        if: matrix.shard == 0
        env:
          OBS04_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD HEAD^{tree}
          flutter --version --machine
          sha256sum pubspec.lock
          python3 tools/test_authority/obs04_receipt_verify.py prepare --packet "$OBS04_RECEIPT_DIR" --source-root .
      - run: ./tools/test_authority_canonical_lane_v1.sh
      - name: Seal OBS04 actual captures
        if: always() && matrix.shard == 0
        run: python3 tools/test_authority/obs04_receipt_verify.py seal --packet "$OBS04_RECEIPT_DIR" --source-root .
      - name: Verify OBS04 machine witness and negatives
        if: always() && matrix.shard == 0
        run: python3 tools/test_authority/obs04_receipt_verify.py verify --packet "$OBS04_RECEIPT_DIR" --expected-execution "$OBS04_RECEIPT_DIR/ci_expected_execution.json" --source-root .
      - name: Preserve OBS04 receipt
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: obs04-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test_authority/obs04/
          if-no-files-found: error

  tier-b:
    name: Tier B maintained support (${{ matrix.shard }}/2)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'tier-b' || inputs.lane == 'all-diagnostic')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      TEST_AUTHORITY_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true
      - run: flutter pub get
      - run: ./tools/test_authority_validate_v1.sh
      - run: ./tools/test_authority_tier_b_v1.sh
