name: Test Authority Lanes

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane to run"
        required: true
        default: "tier-a"
        type: choice
        options:
          - tier-a
          - tier-b
          - tier-c
          - tier-d
          - all-diagnostic
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: test-authority-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  canonical-authority:
    name: Canonical authority (Tier A + terminal Tier B)
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'tier-a' || inputs.lane == 'all-diagnostic')) }}
    runs-on: ubuntu-latest
    env:
      OBS04_RECEIPT_DIR: ${{ github.workspace }}/build/test_authority/obs04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true
      - run: flutter pub get
      - name: Prepare OBS04 execution manifest
        env:
          OBS04_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD HEAD^{tree}
          flutter --version --machine
          sha256sum pubspec.lock
          python3 tools/test_authority/obs04_receipt_verify.py prepare --packet "$OBS04_RECEIPT_DIR" --source-root .
      - run: ./tools/test_authority_canonical_lane_v1.sh
      - name: Seal OBS04 actual captures
        if: always()
        run: python3 tools/test_authority/obs04_receipt_verify.py seal --packet "$OBS04_RECEIPT_DIR" --source-root .
      - name: Verify OBS04 machine witness and negatives
        if: always()
        run: python3 tools/test_authority/obs04_receipt_verify.py verify --packet "$OBS04_RECEIPT_DIR" --expected-execution "$OBS04_RECEIPT_DIR/ci_expected_execution.json" --source-root .
      - name: Preserve OBS04 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs04-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test_authority/obs04/
          if-no-files-found: error

  tier-b:
    name: Tier B maintained support
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'tier-b' || inputs.lane == 'all-diagnostic')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true
      - run: flutter pub get
      - run: ./tools/test_authority_validate_v1.sh
      - run: ./tools/test_authority_tier_b_v1.sh

  tier-c:
    name: Tier C quarantine
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'tier-c' || inputs.lane == 'all-diagnostic')) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true
      - run: flutter pub get
      - run: ./tools/test_authority_validate_v1.sh
      - run: ./tools/test_authority_tier_c_v1.sh

  tier-d:
    name: Tier D retired
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.lane == 'tier-d' || inputs.lane == 'all-diagnostic') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true
      - run: flutter pub get
      - run: ./tools/test_authority_validate_v1.sh
      - run: ./tools/test_authority_tier_d_v1.sh
