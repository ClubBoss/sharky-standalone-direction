name: S11 hosted iOS graded acceptance
on:
  workflow_dispatch:
    inputs:
      shard:
        description: Native learner shard to execute against the pinned binary
        required: true
        default: all
        type: choice
        options: [all, clean-recap, wrong-recap, repair]
permissions:
  contents: read
  actions: read

jobs:
  frozen-native-acceptance:
    runs-on: macos-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shard == 'all' && '["clean-recap","wrong-recap","repair"]' || format('["{0}"]', inputs.shard)) }}
    steps:
      - name: Checkout QA-only test infrastructure
        uses: actions/checkout@v4
        with:
          path: qa-infra
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Checkout frozen app source (never QA branch)
        uses: actions/checkout@v4
        with:
          path: frozen-source
          ref: 179105da294be3e7918369dcf841a584ea36fce4
          fetch-depth: 1
      - name: Verify exact source, environment and ownership
        run: |
          set -euo pipefail
          test "$(git -C frozen-source rev-parse HEAD)" = "179105da294be3e7918369dcf841a584ea36fce4"
          test "$(git -C frozen-source rev-parse HEAD^{tree})" = "be495b6d84c79a66930c5316b93adb56213a00dd"
          mkdir -p output/s11_hosted
          xcodebuild -version > output/s11_hosted/host-xcode.txt
          sw_vers > output/s11_hosted/host-macos.txt
          ruby -e 'require "xcodeproj"; puts "XCODEPROJ_GEM_AVAILABLE"' | tee output/s11_hosted/gem-preflight.txt
          xcrun simctl list devices available -j > output/s11_hosted/simulators.json
          echo "179105da294be3e7918369dcf841a584ea36fce4" > output/s11_hosted/source-head.txt
      - name: Download hosted app built from frozen source in feasibility run
        uses: actions/download-artifact@v4
        with:
          name: s11-hosted-feasibility-38536489523
          run-id: 38536489523
          repository: ClubBoss/sharky-standalone-direction
          github-token: ${{ github.token }}
          path: output/s11_hosted
      - name: Verify new hosted binary provenance
        run: |
          set -euo pipefail
          shasum -a 256 output/s11_hosted/Runner.zip | diff -u output/s11_hosted/app-archive-sha.txt -
          rm -rf output/s11_hosted/Runner.app
          ditto -x -k output/s11_hosted/Runner.zip output/s11_hosted
          test -d output/s11_hosted/Runner.app
          grep -Fx 'source=179105da294be3e7918369dcf841a584ea36fce4' output/s11_hosted/binary-provenance.txt
          test "$(awk '{print $1}' output/s11_hosted/kernel-sha.txt)" = "6ff4850f95eefc64cdc534dddd6f4903852c3cce4989bd9e420e45d3ed912716"
          test "$(awk '{print $1}' output/s11_hosted/manifest-file-sha.txt)" = "594d93c08d37a35a4d8aec010489c2d903a66ed77a33f54f873e12fe488ac2a7"
          test "$(awk '{print $1}' output/s11_hosted/app-archive-sha.txt)" = "39b97deaafb9a2858e460552d8bf320884af98de9b8a7ba1394f296f779cae21"
          test -s output/s11_hosted/kernel-sha.txt
          shasum -a 256 output/s11_hosted/Runner.app/Frameworks/App.framework/flutter_assets/kernel_blob.bin | diff -u output/s11_hosted/kernel-sha.txt -
          # The attested zip preserves all files, including hidden placeholders.
          shasum -a 256 output/s11_hosted/app-file-manifest.sha256 | diff -u output/s11_hosted/manifest-file-sha.txt -
          sort output/s11_hosted/app-file-manifest.sha256 > output/s11_hosted/real-file-manifest.sha256
          find output/s11_hosted/Runner.app -type f -print0 | xargs -0 shasum -a 256 | sort > output/s11_hosted/real-files-received.sha256
          diff -u output/s11_hosted/real-file-manifest.sha256 output/s11_hosted/real-files-received.sha256
          echo S11_NEW_BINARY_REAL_FILE_PARITY_PASS > output/s11_hosted/binary-file-verdict.txt
          cp output/s11_hosted/kernel-sha.txt output/s11_hosted/native-tested-binary.txt
          echo "new GitHub-hosted binary; never equate to historical local kernel" >> output/s11_hosted/native-tested-binary.txt
      - name: Create independent UITest-only Xcode project without app rebuild
        run: |
          ruby qa-infra/tools/qa_s11_create_xcodeproj.rb
          xcodebuild -list -project qa-infra/qa/s11_hosted/S11HostedNative.xcodeproj | tee output/s11_hosted/uitest-project-list.txt
      - name: Create isolated learner device and install immutable app
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 - <<'PYDEVICE' > output/s11_hosted/selected-simulator.txt
          import json,os,subprocess
          data=json.load(open('output/s11_hosted/simulators.json'))['devices']
          candidates=[(r,d) for r,ds in data.items() if 'iOS' in r for d in ds if d.get('isAvailable') and 'iPhone' in d.get('name','')]
          assert candidates,'NO_HOSTED_IOS_RUNTIME'
          shard=os.environ['SHARD']
          if shard=='repair':
              runtime=candidates[0][0]
              raw=subprocess.check_output(['xcrun','simctl','list','devicetypes','-j'],text=True)
              open('output/s11_hosted/device-types.json','w').write(raw)
              types=json.loads(raw)['devicetypes']
              matches=[t for t in types if 'iPhone SE' in t['name'] and '3rd generation' in t['name']]
              assert len(matches)==1,'REQUIRED_COMPACT_DEVICE_TYPE_MISSING'
              kind=matches[0]['identifier']
          else:
              name='iPhone 17 Pro Max' if shard=='wrong-recap' else 'iPhone 17 Pro'
              matches=[(r,d) for r,d in candidates if d['name']==name]
              assert matches,'REQUIRED_DEVICE_MISSING_'+name
              runtime,d=matches[0];kind=d['deviceTypeIdentifier']
          print(subprocess.check_output(['xcrun','simctl','create','S11-'+shard,kind,runtime],text=True).strip())
          PYDEVICE
          SIM_ID="$(cat output/s11_hosted/selected-simulator.txt)"
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          if test "$SHARD" = repair; then
            # D2: real OS Reduce Motion on the isolated device, applied before the
            # app ever launches. Settings-UI automation hung (run 38541883243).
            xcrun simctl spawn "$SIM_ID" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
            xcrun simctl shutdown "$SIM_ID"
            xcrun simctl boot "$SIM_ID"
            xcrun simctl bootstatus "$SIM_ID" -b
            xcrun simctl spawn "$SIM_ID" defaults read com.apple.Accessibility ReduceMotionEnabled | tee output/s11_hosted/os-reduce-motion-pref.txt
          fi
          xcrun simctl install "$SIM_ID" output/s11_hosted/Runner.app
          xcrun simctl list devices available -j > output/s11_hosted/tested-devices.json
          # Attach the host Simulator display before asking its screen service.
          # A newly created Pro Max booted/launched but produced no PNG in 60s
          # without this UI attachment. No learner state is changed here.
          open -a Simulator --args -CurrentDeviceUDID "$SIM_ID"
          sleep 5
          # Warm the real screenshot service while first-use state is untouched.
          xcrun simctl launch "$SIM_ID" com.example.pokerAnalyzer > output/s11_hosted/preflight-launch.txt
          python3 - "$SIM_ID" <<'PYPREWARM'
          import subprocess,sys
          from pathlib import Path
          subprocess.run(['xcrun','simctl','io',sys.argv[1],'screenshot','output/s11_hosted/native-ready.png'],check=True,timeout=60)
          assert Path('output/s11_hosted/native-ready.png').read_bytes()[:8]==b'\x89PNG\r\n\x1a\n'
          PYPREWARM
          xcrun simctl terminate "$SIM_ID" com.example.pokerAnalyzer
      - name: Execute genuine shard with strict native and persisted gates
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          SIM_ID="$(cat output/s11_hosted/selected-simulator.txt)"
          case "$SHARD" in
            clean-recap) METHOD=test06CleanAndRecap ;;
            wrong-recap) METHOD=test03WrongRecap ;;
            repair) METHOD=test04AuthenticRepair ;;
          esac
          python3 -u qa-infra/tools/qa_s11_watch_checkpoints.py --log output/s11_hosted/native-tests.log --sim "$SIM_ID" --output output/s11_hosted/checkpoints > output/s11_hosted/checkpoint-observer.log 2>&1 &
          OBSERVER_PID=$!
          trap 'kill "$OBSERVER_PID" 2>/dev/null || true' EXIT
          xcodebuild test -project qa-infra/qa/s11_hosted/S11HostedNative.xcodeproj -scheme S11HostedNativeUITests -destination "platform=iOS Simulator,id=$SIM_ID" -parallel-testing-enabled NO -only-testing:S11HostedNativeUITests/S11HostedNativeUITests/$METHOD -resultBundlePath "$PWD/output/s11_hosted/native-tests.xcresult" CODE_SIGNING_ALLOWED=NO > output/s11_hosted/native-tests.log 2>&1 || { tail -120 output/s11_hosted/native-tests.log; exit 1; }
          python3 - <<'PYCOUNT'
          import re
          from pathlib import Path
          text=Path('output/s11_hosted/native-tests.log').read_text()
          assert any(int(n)>0 for n in re.findall(r'Executed (\d+) tests?',text)), 'ZERO_EXECUTED_XCTESTS'
          assert '** TEST SUCCEEDED **' in text
          PYCOUNT
          python3 qa-infra/tools/qa_s11_verify_evidence.py --screens output/s11_hosted/native-tests.log output/s11_hosted/checkpoints
          if test "$SHARD" != repair; then
            python3 qa-infra/tools/qa_s11_verify_closure.py output/s11_hosted/checkpoints
          fi
          python3 qa-infra/tools/qa_s11_verify_integrated.py output/s11_hosted/checkpoints "$SHARD"
      - name: Preserve actual native receipts even on failure
        if: always()
        run: |
          if test -d output/s11_hosted/native-tests.xcresult; then
            xcrun xcresulttool export attachments --path output/s11_hosted/native-tests.xcresult --output-path output/s11_hosted/attachments || true
          fi
      - name: Upload native shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s11-integrated-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            output/s11_hosted/
            !output/s11_hosted/Runner.app/**
            !output/s11_hosted/Runner.zip
          if-no-files-found: error
          retention-days: 14
