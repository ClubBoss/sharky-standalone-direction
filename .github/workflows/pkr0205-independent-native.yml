name: PKR02-05 independent EN14Pro native acceptance
on:
  push:
    branches: [qa/pkr0205-independent-native-20261110]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pkr0205-independent-native-single-writer
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 70
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa-infra
      - uses: actions/checkout@v4
        with:
          path: product
          ref: fdff8a471817f9063b15e1a6a43c92eb4e2204a7
      - name: Freeze exact product and host identities
        run: |
          set -euo pipefail
          mkdir -p output/pkr0205-native
          test "$(git -C product rev-parse HEAD)" = fdff8a471817f9063b15e1a6a43c92eb4e2204a7
          test "$(git -C product rev-parse HEAD^{tree})" = 12ada8e1839e16dfe1651d2c94511c4085c17e4e
          git -C product rev-parse HEAD HEAD^{tree} > output/pkr0205-native/product-identity.txt
          git -C qa-infra rev-parse HEAD HEAD^{tree} > output/pkr0205-native/qa-identity.txt
          sw_vers > output/pkr0205-native/macos.txt
          xcodebuild -version > output/pkr0205-native/xcode.txt
          test "$(head -n 1 output/pkr0205-native/xcode.txt)" = 'Xcode 26.2'
          xcrun simctl list -j > output/pkr0205-native/simulator-inventory.json
          ruby -e 'require "xcodeproj"; puts Xcodeproj::VERSION' > output/pkr0205-native/xcodeproj-version.txt
      - name: Recover exact product binary from prior build without recompilation
        uses: actions/download-artifact@v4
        with:
          name: pkr0205-independent-native-42788406050
          run-id: 42788406050
          github-token: ${{ github.token }}
          path: output/pkr0205-native
      - name: Verify sealed source and restore original simulator bundle
        run: |
          set -euo pipefail
          D=output/pkr0205-native
          test -f "$D/Runner.zip"
          test -f "$D/runner-archive.sha256"
          (cd "$D" && shasum -a 256 -c runner-archive.sha256 && ditto -x -k Runner.zip .)
          test -d "$D/Runner.app"
          (cd "$D" && shasum -a 256 -c kernel.sha256 && shasum -a 256 -c runner-files.sha256 > installed-files-check.txt)
          test "$(git -C product rev-parse HEAD)" = fdff8a471817f9063b15e1a6a43c92eb4e2204a7
          test "$(git -C product rev-parse HEAD^{tree})" = 12ada8e1839e16dfe1651d2c94511c4085c17e4e
          echo 'Restored exact fdff8a47 app from GitHub artifact 13752117630; no product rebuild or state injection' > "$D/reuse-mode.txt"
      - name: Create only fresh iPhone 14 Pro with iOS 26.2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('output/pkr0205-native')
          inventory = json.loads((root / 'simulator-inventory.json').read_text())
          types = [t for t in inventory['devicetypes'] if t['name'] == 'iPhone 14 Pro']
          runtimes = [r for r in inventory['runtimes'] if r.get('isAvailable') and r['version'] == '26.2' and 'iOS' in r['identifier']]
          assert len(types) == 1 and len(runtimes) == 1, 'EXACT_EN14PRO_RUNTIME_NOT_AVAILABLE_NO_FALLBACK'
          device_type, runtime = types[0], runtimes[0]
          sim = subprocess.check_output(['xcrun', 'simctl', 'create', 'PKR0205-EN14Pro-Fresh', device_type['identifier'], runtime['identifier']], text=True).strip()
          (root / 'sim-id.txt').write_text(sim)
          (root / 'selected-device.json').write_text(json.dumps({'udid': sim, 'model': device_type['name'], 'device_type': device_type['identifier'], 'runtime': runtime['identifier'], 'runtime_version': runtime['version'], 'language': 'en', 'logical_size': [393, 852]}, indent=2))
          PY
          PKR_SIM_ID="$(cat output/pkr0205-native/sim-id.txt)"
          xcrun simctl boot "$PKR_SIM_ID"
          xcrun simctl bootstatus "$PKR_SIM_ID" -b
          xcrun simctl install "$PKR_SIM_ID" output/pkr0205-native/Runner.app
          open -a Simulator --args -CurrentDeviceUDID "$PKR_SIM_ID"
          xcrun simctl launch "$PKR_SIM_ID" com.example.pokerAnalyzer -AppleLanguages '(en)' -AppleLocale en_US > output/pkr0205-native/prewarm-launch.txt
          # A pre-test screenshot on a freshly booted macOS-26 simulator can hang.
          # The actual XCTest + independent screenshot collector still require
          # real 1179x2556 screenshots; do not turn a timeout into PASS.
          echo 'Optional prewarm screenshot omitted; native captures remain mandatory' > output/pkr0205-native/prewarm-capture-policy.txt
          xcrun simctl terminate "$PKR_SIM_ID" com.example.pokerAnalyzer
          ruby qa-infra/tools/qa_pkr0205_create_xcodeproj.rb
      - name: One ordinary learner UI route and read-only receipts
        run: |
          set -euo pipefail
          PKR_SIM_ID="$(cat output/pkr0205-native/sim-id.txt)"
          python3 -u qa-infra/tools/qa_pkr0205_watch_checkpoints.py --log output/pkr0205-native/native-tests.log --sim "$PKR_SIM_ID" --output output/pkr0205-native/checkpoints > output/pkr0205-native/collector.log 2>&1 &
          PKR_COLLECTOR_PID=$!
          trap 'kill "$PKR_COLLECTOR_PID" 2>/dev/null || true' EXIT
          NSUnbufferedIO=YES xcodebuild test -project qa-infra/qa/pkr0205_hosted/PKR0205Native.xcodeproj -scheme PKR0205NativeUITests -destination "platform=iOS Simulator,id=$PKR_SIM_ID" -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -only-testing:PKR0205NativeUITests/PKR0205NativeUITests/testDefinitionsFeedbackRestartAndUnprovedBlock -resultBundlePath "$PWD/output/pkr0205-native/native-tests.xcresult" CODE_SIGNING_ALLOWED=NO > output/pkr0205-native/native-tests.log 2>&1
      - name: Verify canonical source-owned receipts and real process restart
        if: always()
        run: python3 qa-infra/tools/qa_pkr0205_verify_native.py output/pkr0205-native
      - name: Seal actual evidence including preserved installed binary
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output/pkr0205-native
          if test -d output/pkr0205-native/native-tests.xcresult; then
            xcrun xcresulttool export attachments --path output/pkr0205-native/native-tests.xcresult --output-path output/pkr0205-native/attachments || true
          fi
          cd output/pkr0205-native
          find . -type f ! -path './Runner.app/*' ! -name evidence.sha256 -print0 | xargs -0 shasum -a 256 > evidence.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkr0205-independent-native-${{ github.run_id }}
          path: |
            output/pkr0205-native/
            !output/pkr0205-native/Runner.app/**
          if-no-files-found: error
          retention-days: 30
