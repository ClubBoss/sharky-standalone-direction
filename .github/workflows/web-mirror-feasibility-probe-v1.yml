name: Web Mirror Feasibility Probe v1

on:
  push:
    branches:
      - probe/web-mirror-feasibility-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact probe SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Record exact build identity
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          git rev-parse HEAD
          flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter web release build
        run: flutter build web --release

      - name: Verify static artifact
        run: |
          test -f build/web/index.html
          find build/web -maxdepth 2 -type f | sort | head -n 80

      - name: Upload build web artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharky-web-feasibility-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 1
